          """

          # =========================================================
          # 1) UYGULAMA ADINI ANKA_RA YAP
          # =========================================================
          app_key_pat = re.compile(
              r'(<string\b[^>]*\bname="(?:app_name|app_name_auto|app_name_auto_release|app_name_mobile|app_name_mobile_release|media_service_name|fermata_app_name|launcher_name)"[^>]*>)(.*?)(</string>)',
              re.DOTALL | re.IGNORECASE
          )
          name_patched = 0
          for dp, _, files in os.walk("fermata/src"):
              if "/test" in dp.replace("\\", "/") or "/androidTest" in dp.replace("\\", "/"):
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "values" in dp:
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = app_key_pat.sub(r'\g<1>' + APP_NAME + r'\g<3>', orig)
                      if new_txt != orig:
                          open(p, "w", encoding="utf-8").write(new_txt)
                          name_patched += 1
                          print(f"Ad degistirildi: {p}")
          print(f"Toplam XML ad yamasi: {name_patched} (Gradle -PAPP_NAME=ANKA_RA ile birlikte)")

          # =========================================================
          # 2) LOGOYU ANKA_RA YAP (Yuklu gorsel > 500B veya gomulu logo)
          # =========================================================
          def load_logo():
              candidates = []
              for pat in ("anka_ra_logo.*", "logo.*", "1000314003.*", "res/anka_ra_logo.*", ".github/anka_ra_logo.*"):
                  candidates.extend(glob.glob(pat))
              for path in candidates:
                  if not os.path.isfile(path) or os.path.getsize(path) < 500:
                      continue
                  if not path.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".heic", ".avif")):
                      continue
                  try:
                      im = Image.open(path).convert("RGBA")
                      print(f"Repodan gecerli logo yuklendi: {path} ({im.size})")
                      return im
                  except Exception as e:
                      print(f"Repodaki {path} acilamadi: {e}")
              if EMBEDDED_LOGO_B64.strip():
                  raw = base64.b64decode("".join(EMBEDDED_LOGO_B64.split()))
                  im = Image.open(io.BytesIO(raw)).convert("RGBA")
                  print(f"Gomulu ANKA_RA logosu kullaniliyor ({im.size})")
                  return im
              return None

          img = load_logo()
          if img is not None:
              w, h = img.size
              side = min(w, h)
              img = ImageOps.fit(img, (side, side), method=Image.Resampling.LANCZOS)

              mipmap_icons = {"ic_launcher", "ic_launcher_round"}
              drawable_icons = set()
              for mf in glob.glob("fermata/src/**/AndroidManifest.xml", recursive=True):
                  if "/test" in mf.replace("\\", "/"):
                      continue
                  mtxt = open(mf, encoding="utf-8", errors="ignore").read()
                  for m in re.finditer(r'android:(?:icon|roundIcon)="@(mipmap|drawable)/([^"]+)"', mtxt):
                      if m.group(1) == "mipmap":
                          mipmap_icons.add(m.group(2))
                      else:
                          drawable_icons.add(m.group(2))
              print("Manifest mipmap ikonlari:", sorted(mipmap_icons))
              print("Manifest drawable ikonlari:", sorted(drawable_icons))

              res_dirs = [d for d in ("fermata/src/main/res", "fermata/src/auto/res") if os.path.isdir(d)]
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              fg_sizes = {
                  "mipmap-mdpi": 108,
                  "mipmap-hdpi": 162,
                  "mipmap-xhdpi": 216,
                  "mipmap-xxhdpi": 324,
                  "mipmap-xxxhdpi": 432,
              }

              for rdir in res_dirs:
                  for dp, _, files in os.walk(rdir):
                      base = os.path.basename(dp)
                      if not base.startswith("mipmap-"):
                          continue
                      for fn in files:
                          stem = os.path.splitext(fn)[0]
                          if stem in mipmap_icons or stem == "anka_ra_ic_fg":
                              os.remove(os.path.join(dp, fn))

                  for folder, px in sizes.items():
                      out_dir = os.path.join(rdir, folder)
                      os.makedirs(out_dir, exist_ok=True)
                      resized = img.resize((px, px), Image.Resampling.LANCZOS)
                      for iname in mipmap_icons:
                          resized.save(os.path.join(out_dir, f"{iname}.png"))

                  for folder, px in fg_sizes.items():
                      out_dir = os.path.join(rdir, folder)
                      os.makedirs(out_dir, exist_ok=True)
                      canvas = Image.new("RGBA", (px, px), (5, 8, 16, 255))
                      inner = int(px * 0.72)
                      fg_icon = img.resize((inner, inner), Image.Resampling.LANCZOS)
                      off = (px - inner) // 2
                      canvas.paste(fg_icon, (off, off), fg_icon)
                      canvas.save(os.path.join(out_dir, "anka_ra_ic_fg.png"))

                  anydpi = os.path.join(rdir, "mipmap-anydpi-v26")
                  os.makedirs(anydpi, exist_ok=True)
                  adaptive_xml = (
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      '    <background android:drawable="@color/anka_ra_icon_bg" />\n'
                      '    <foreground android:drawable="@mipmap/anka_ra_ic_fg" />\n'
                      '</adaptive-icon>\n'
                  )
                  for iname in mipmap_icons:
                      open(os.path.join(anydpi, f"{iname}.xml"), "w", encoding="utf-8").write(adaptive_xml)

                  if drawable_icons:
                      for dp, _, files in os.walk(rdir):
                          base = os.path.basename(dp)
                          if not base.startswith("drawable"):
                              continue
                          for fn in files:
                              stem = os.path.splitext(fn)[0]
                              if stem in drawable_icons:
                                  os.remove(os.path.join(dp, fn))
                                  print(f"Eski drawable ikon silindi: {os.path.join(dp, fn)}")
                      d_out = os.path.join(rdir, "drawable-xxxhdpi")
                      os.makedirs(d_out, exist_ok=True)
                      d_img = img.resize((192, 192), Image.Resampling.LANCZOS)
                      for dname in drawable_icons:
                          d_img.save(os.path.join(d_out, f"{dname}.png"))

                  val_dir = os.path.join(rdir, "values")
                  os.makedirs(val_dir, exist_ok=True)
                  open(os.path.join(val_dir, "anka_ra_colors.xml"), "w", encoding="utf-8").write(
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<resources>\n'
                      '    <color name="anka_ra_icon_bg">#050810</color>\n'
                      '</resources>\n'
                  )
              print("OK: ANKA_RA logosu tum cozunurluklere islendi.")
          else:
              print("UYARI: Gecerli logo bulunamadi! Repoya anka_ra_logo.png yukleyin.")

          # =========================================================
          # 3) KAHVE / KO-FI / BAGIS UYARISINI 3 KAYNAKTAN KALDIR
          #    (SponsorBlock'a dokunmaz!)
          # =========================================================

          # 3A) PhoneSupportBannerController.java (4 saniyelik kahve banner uyarisi)
          banner_java = "fermata/src/main/java/me/aap/fermata/ui/view/PhoneSupportBannerController.java"
          if os.path.isfile(banner_java):
              src = open(banner_java, encoding="utf-8").read()
              new_src = src.replace("View.VISIBLE", "View.GONE")
              # Banner gosteren void metotlari erken sonlandir
              void_pat = re.compile(r'(\bvoid\s+(?:show|maybeShow|display|schedule|attach|bind|start|init|onStart|onResume)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*\{)')
              new_src = void_pat.sub(r'\1 if (true) return; ', new_src)
              if new_src != src:
                  open(banner_java, "w", encoding="utf-8").write(new_src)
                  print("OK: PhoneSupportBannerController kapatildi.")

          # Banner XML layout'larini GONE yap
          for dp, _, files in os.walk("fermata/src"):
              if "/test" in dp.replace("\\", "/"):
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "layout" in dp:
                      p = os.path.join(dp, fn)
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                      if "support_banner" in txt or "@drawable/coffee" in txt:
                          if 'android:visibility=' in txt:
                              new_txt = re.sub(r'android:visibility="[^"]*"', 'android:visibility="gone"', txt, count=1)
                          else:
                              new_txt = re.sub(r'(<[A-Za-z0-9_.]+\b)', r'\1 android:visibility="gone"', txt, count=1)
                          if new_txt != txt:
                              open(p, "w", encoding="utf-8").write(new_txt)
                              print(f"OK: Kahve banner layout gizlendi: {p}")

          # 3B) NavBarMediator.java (Alt/yan menudeki kahve butonu ve diyalogu)
          nav_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/NavBarMediator.java"
          if os.path.isfile(nav_java):
              src = open(nav_java, encoding="utf-8").read()
              new_src = re.sub(
                  r'if\s*\(\s*BuildConfig\.AUTO\s*\)\s*b\.addItem\(\s*R\.id\.nav_donate',
                  'if (false && BuildConfig.AUTO) b.addItem(R.id.nav_donate',
                  src
              )
              new_src = re.sub(
                  r'if\s*\(\s*BuildConfig\.AUTO\s*&&\s*\(\s*item\.getItemId\(\)\s*==\s*R\.id\.nav_donate\s*\)\s*\)',
                  'if (false && BuildConfig.AUTO && (item.getItemId() == R.id.nav_donate))',
                  new_src
              )
              if new_src != src:
                  open(nav_java, "w", encoding="utf-8").write(new_src)
                  print("OK: NavBarMediator kahve menusu kaldirildi.")

          # 3C) SettingsFragment.java (Ayarlardaki Ko-fi / kahve satiri)
          settings_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/SettingsFragment.java"
          if os.path.isfile(settings_java):
              src = open(settings_java, encoding="utf-8").read()
              idx = src.find("R.string.support_kofi_title")
              if idx != -1:
                  brace_open = src.rfind("{", 0, idx)
                  if brace_open != -1 and "->" in src[max(0, brace_open - 25):brace_open]:
                      stmt_start = max(src.rfind(";", 0, brace_open), src.rfind("{", 0, brace_open), src.rfind("}", 0, brace_open)) + 1
                      depth = 0
                      i = brace_open
                      while i < len(src):
                          if src[i] == "{":
                              depth += 1
                          elif src[i] == "}":
                              depth -= 1
                              if depth == 0:
                                  break
                          i += 1
                      semi = src.find(";", i)
                      if semi != -1:
                          stmt = src[stmt_start:semi + 1]
                          new_src = src[:stmt_start] + "\n        if (false) { " + stmt.strip() + " }\n" + src[semi + 1:]
                          open(settings_java, "w", encoding="utf-8").write(new_src)
                          print("OK: SettingsFragment Ko-fi butonu kaldirildi.")

          # =========================================================
          # 4) ADDON (AUDIOBOOKS / STREMIO / TIKTOK) & TV INCELEME (TEST HARIC)
          # =========================================================
          print("=== ADDON & DASHBOARD DOSYALARI (src/main) ===")
          for dp, _, files in os.walk("fermata/src"):
              norm = dp.replace("\\", "/")
              if "/test" in norm or "/androidTest" in norm:
                  continue
              for fn in files:
                  if not fn.endswith(".java"):
                      continue
                  p = os.path.join(dp, fn)
                  txt = open(p, encoding="utf-8", errors="ignore").read()
                  if any(k in fn for k in ("AddonManager", "PhoneLauncher", "GlassPhone", "AddonUiMetadata", "AddonsFragment")):
                      print(f"--- DOSYA: {p} ---")
                      for idx, line in enumerate(txt.splitlines(), 1):
                          if re.search(r'(audiobook|stremio|tiktok|getAddonInfos|isEnabled|ADDONS|Role\.|Addon Module|dashboard|card)', line, re.IGNORECASE):
                              print(f"  {idx}: {line.strip()[:140]}")

          print("=== TV MODULU DOSYALARI (modules/tv/src/main) ===")
          if os.path.isdir("modules/tv/src/main"):
              for dp, _, files in os.walk("modules/tv/src/main"):
                  for fn in files:
                      if fn.endswith(".java"):
                          print(" ", os.path.join(dp, fn))
          PY

      - name: Build Auto Release Bundle (AAB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew :fermata:bundleAutoRelease -PAPP_NAME=ANKA_RA --no-daemon

      - name: Build Single Signed Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          AAB_PATH=$(find fermata/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -path "*/outputs/bundle/*" -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "Hata: .aab dosyasi bulunamadi."
            find . -name "*.aab"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/google/bundletool/releases/latest",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "ANKA-RA-Builder"
              }
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if a["name"].endswith(".jar"))
          urllib.request.urlretrieve(url, os.path.join(os.environ["RUNNER_TEMP"], "bundletool.jar"))
          PY

          mkdir -p signed-apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB_PATH" \
            --output="$RUNNER_TEMP/anka_ra.apks" \
            --mode=universal \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass="pass:$KS_PASS"

          unzip -o "$RUNNER_TEMP/anka_ra.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "signed-apks/ANKA_RA-auto-universal-signed.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "signed-apks/ANKA_RA-auto-universal-signed.apk"
          ls -lh "signed-apks/ANKA_RA-auto-universal-signed.apk"

      - name: Upload Single Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ANKA_RA-auto-universal-apk
          path: signed-apks/ANKA_RA-auto-universal-signed.apk
          retention-days: 30
