name: Build Signed Fermata Auto APK (Zero-PC)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore and Patch Fork Cert Check
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FermataHacim, O=Personal, C=TR"

          printf "\nstoreFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PATH" "$KS_PASS" "$K_ALIAS" "$KS_PASS" >> local.properties

          python3 -c 'p="settings.gradle"; s=open(p).read(); t="!gradle.ext.approvedUploadCertificatesSha256.contains(fingerprint)"; assert t in s, "Hedef satir bulunamadi"; open(p,"w").write(s.replace(t,"false && "+t,1)); print("OK: sertifika kilidi acildi")'

      - name: Build Auto Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew assembleAutoRelease --no-daemon

      - name: Collect Signed APKs
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          mkdir -p signed-apks

          FOUND=0
          while IFS= read -r apk; do
            FOUND=1
            base=$(basename "$apk" .apk)
            signed="signed-apks/${base}-signed.apk"
            if "$BUILD_TOOLS/apksigner" verify "$apk" >/dev/null 2>&1; then
              cp "$apk" "$signed"
            else
              aligned="$RUNNER_TEMP/${base}-aligned.apk"
              "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$aligned"
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$KS_PATH" \
                --ks-key-alias "$K_ALIAS" \
                --ks-pass "pass:$KS_PASS" \
                --key-pass "pass:$KS_PASS" \
                --out "$signed" \
                "$aligned"
              "$BUILD_TOOLS/apksigner" verify "$signed"
            fi
            echo "Hazir APK: $signed"
          done < <(find . -path "*/outputs/apk/*" -name "*auto*release*.apk")

          if [ "$FOUND" -eq 0 ]; then
            echo "Hata: auto-release APK bulunamadi."
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: fermata-auto-signed-apks
          path: signed-apks/*.apk
          retention-days: 30
