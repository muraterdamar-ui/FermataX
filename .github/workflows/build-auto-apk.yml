                  '    <color name="anka_ra_cyan">#00C2FF</color>\n'
                  '    <color name="anka_ra_crimson">#FF3D2E</color>\n'
                  '    <color name="anka_ra_gold">#FBBF24</color>\n'
                  '    <color name="anka_ra_glass_stroke">#4000C2FF</color>\n'
                  '    <color name="anka_ra_text_primary">#F8FAFC</color>\n'
                  '    <color name="anka_ra_text_secondary">#94A3B8</color>\n'
