name: Build Signed Fermata Auto APK (Zero-PC)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore and Patch Fork Cert Check
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FermataHacim, O=Personal, C=TR"

          printf "\nstoreFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PATH" "$KS_PASS" "$K_ALIAS" "$KS_PASS" >> local.properties

          python3 -c 'p="settings.gradle"; s=open(p).read(); t="!gradle.ext.approvedUploadCertificatesSha256.contains(fingerprint)"; assert t in s, "Hedef satir bulunamadi"; open(p,"w").write(s.replace(t,"false && "+t,1)); print("OK: sertifika kilidi acildi")'

      - name: Remove Donate and Buy Me a Coffee Prompts
        run: |
          python3 - <<'PY'
          import os, re

          roots = [r for r in ("fermata/src", "modules", "depends/utils/src") if os.path.isdir(r)]
          string_pat = re.compile(r'<string\s+name="([^"]+)"[^>]*>(.*?)</string>', re.DOTALL | re.IGNORECASE)
          kw_text = re.compile(r'(kahve|coffee|buymeacoffee|ko-fi|donate|bağış|bagis|paypal|destek\s*ol)', re.IGNORECASE)

          found_keys = set()
          for root in roots:
              for dp, _, files in os.walk(root):
                  for fn in files:
                      if fn.endswith(".xml") and "values" in dp:
                          p = os.path.join(dp, fn)
                          txt = open(p, encoding="utf-8", errors="ignore").read()
                          for m in string_pat.finditer(txt):
                              if kw_text.search(m.group(1)) or kw_text.search(m.group(2)):
                                  found_keys.add(m.group(1))

          print("Bulunan string anahtarlari:", sorted(found_keys))

          java_pat = re.compile(
              r'(\bvoid\s+[A-Za-z0-9_]*(?:donate|coffee|buymeacoffee|sponsor|patron)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*(?:throws\s+[^{;]+)?\{)',
              re.IGNORECASE
          )
          kt_pat = re.compile(
              r'(\bfun\s+[A-Za-z0-9_]*(?:donate|coffee|buymeacoffee|sponsor|patron)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*\{)',
              re.IGNORECASE
          )
          menu_pat = re.compile(r'<item\b[^>]*>', re.DOTALL)
          key_ref_pat = re.compile(
              r'(' + '|'.join(re.escape(k) for k in sorted(found_keys)) + r'|buymeacoffee|ko-fi|coffee|donate)',
              re.IGNORECASE
          ) if found_keys else re.compile(r'(buymeacoffee|ko-fi|coffee|donate)', re.IGNORECASE)

          def patch_menu_item(m):
              tag = m.group(0)
              if re.search(r'(donate|coffee|buymeacoffee|sponsor)', tag, re.IGNORECASE):
                  if 'android:visible' not in tag:
                      if tag.endswith('/>'):
                          return tag[:-2] + ' android:visible="false" />'
                      return tag[:-1] + ' android:visible="false">'
              return tag

          patched_files = 0
          hits = []

          for root in roots:
              for dp, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if fn.endswith((".java", ".kt")):
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          new_txt, n = (java_pat if fn.endswith(".java") else kt_pat).subn(r'\1 if (true) return; ', orig)
                          if n > 0:
                              open(p, "w", encoding="utf-8").write(new_txt)
                              patched_files += 1
                              print(f"Metot kapatildi ({n}): {p}")
                          for idx, line in enumerate(orig.splitlines(), 1):
                              if key_ref_pat.search(line) and len(hits) < 40:
                                  hits.append(f"{p}:{idx}: {line.strip()[:140]}")
                      elif fn.endswith(".xml") and "menu" in dp:
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          new_txt = menu_pat.sub(patch_menu_item, orig)
                          if new_txt != orig:
                              open(p, "w", encoding="utf-8").write(new_txt)
                              patched_files += 1
                              print(f"Menu gizlendi: {p}")

          print(f"Toplam yamalanan dosya: {patched_files}")
          if hits:
              print("--- Kod icindeki referanslar (kontrol icin) ---")
              for h in hits:
                  print(h)
          PY

      - name: Build Auto Release Bundle (AAB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew :fermata:bundleAutoRelease --no-daemon

      - name: Build Single Signed Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          AAB_PATH=$(find fermata/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -path "*/outputs/bundle/*" -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "Hata: .aab dosyasi bulunamadi."
            find . -name "*.aab"
            exit 1
          fi
          echo "Bulunan AAB: $AAB_PATH"

          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/google/bundletool/releases/latest",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "FermataX-Builder"
              }
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if a["name"].endswith(".jar"))
          print("bundletool indiriliyor:", url)
          urllib.request.urlretrieve(url, os.path.join(os.environ["RUNNER_TEMP"], "bundletool.jar"))
          PY

          mkdir -p signed-apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB_PATH" \
            --output="$RUNNER_TEMP/fermata.apks" \
            --mode=universal \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass="pass:$KS_PASS"

          unzip -o "$RUNNER_TEMP/fermata.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "signed-apks/fermataX-auto-universal-signed.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "signed-apks/fermataX-auto-universal-signed.apk"
          ls -lh "signed-apks/fermataX-auto-universal-signed.apk"

      - name: Upload Single Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: fermataX-auto-universal-apk
          path: signed-apks/fermataX-auto-universal-signed.apk
          retention-days: 30
