
name: Build Signed Fermata Auto APK (Zero-PC)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Auto Release APK
        run: ./gradlew assembleAutoRelease --no-daemon --stacktrace

      - name: Prepare Keystore and Sign APKs
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026!"
          K_ALIAS="fermata"

          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FermataHacim, O=Personal, C=TR"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          mkdir -p signed-apks

          FOUND=0
          while IFS= read -r apk; do
            FOUND=1
            base=$(basename "$apk" .apk)
            aligned="$RUNNER_TEMP/${base}-aligned.apk"
            signed="signed-apks/${base}-signed.apk"

            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$K_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              --out "$signed" \
              "$aligned"

            "$BUILD_TOOLS/apksigner" verify "$signed"
            echo "Imzalandi: $signed"
          done < <(find . -path "*/outputs/apk/*" -name "*auto*release*.apk")

          if [ "$FOUND" -eq 0 ]; then
            echo "Hata: auto-release APK bulunamadi."
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: fermata-auto-signed-apks
          path: signed-apks/*.apk
          retention-days: 30
