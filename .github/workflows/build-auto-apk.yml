          def safe_write_xml(path, new_txt, orig_txt):
              if new_txt == orig_txt:
                  return False
              try:
                  ET.fromstring(new_txt.encode("utf-8"))
                  open(path, "w", encoding="utf-8").write(new_txt)
                  return True
              except Exception as e:
                  print(f"XML dogrulama atladi ({path}): {e}")
                  return False

          # =========================================================
          # 1) UYGULAMA ADINI ANKA_RA YAP + TURKCE ARAYUZ ETIKETLERI
