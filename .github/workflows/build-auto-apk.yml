          #    (Folders -> Telefon Muzikleri olarak gorunur)
          # =========================================================
          app_key_pat = re.compile(
              r'(<string\b[^>]*\bname="(?:app_name|app_name_auto|app_name_auto_release|app_name_mobile|app_name_mobile_release|media_service_name|fermata_app_name|launcher_name)"[^>]*>)(.*?)(</string>)',
              re.DOTALL | re.IGNORECASE
          )
          tr_exact_labels = {
              "Open on car": "Araçta Aç",
              "AA disconnected": "AA Bağlı Değil",
              "AA connected": "AA Bağlı",
              "Find Car": "Araç Bul",
              "Addons": "ANKA_RA",
              "Addon Module": "Medya Modülü",
              "Folders": "Telefon Müzikleri",
              "Local &amp; external storage": "Telefon hafızasındaki müzik dosyaları",
              "Local & external storage": "Telefon hafızasındaki müzik dosyaları",
              "Saved media collections": "Kayıtlı medya listeleri",
              "Quick access starred tracks": "Yıldızlı hızlı erişim",
              "Phone Apps": "Telefon Uygulamaları",
              "Playlists": "Çalma Listeleri",
              "Favorites": "Favoriler",
              "Recent": "Son Çalınanlar",
          }

          name_patched = 0
          for dp, _, files in os.walk("fermata/src"):
              norm = dp.replace("\\", "/")
              if "/test" in norm or "/androidTest" in norm:
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "values" in dp:
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = app_key_pat.sub(r'\g<1>' + APP_NAME + r'\g<3>', orig)
                      if os.path.basename(dp) in ("values", "values-tr"):
                          for eng, tr_val in tr_exact_labels.items():
                              new_txt = re.sub(
                                  r'(<string\b[^>]*>)\s*' + re.escape(eng) + r'\s*(</string>)',
                                  r'\g<1>' + tr_val + r'\g<2>',
                                  new_txt
                              )
                      if safe_write_xml(p, new_txt, orig):
                          name_patched += 1
                          print(f"String yamalandi: {p}")
          print(f"Toplam XML string yamasi: {name_patched}")

          # =========================================================
          # 2) LOGOYU ANKA_RA YAP
          # =========================================================
          def load_logo():
              candidates = []
              for pat in ("anka_ra_logo.*", "logo.*", "1000314003.*", "res/anka_ra_logo.*", ".github/anka_ra_logo.*"):
                  candidates.extend(glob.glob(pat))
              for path in candidates:
                  if not os.path.isfile(path) or os.path.getsize(path) < 500:
                      continue
                  if not path.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".heic", ".avif")):
                      continue
                  try:
                      im = Image.open(path).convert("RGBA")
                      print(f"Repodan logo yuklendi: {path} ({im.size})")
                      return im
                  except Exception:
                      pass
              raw = base64.b64decode("".join(EMBEDDED_LOGO_B64.split()))
              im = Image.open(io.BytesIO(raw)).convert("RGBA")
              print(f"Gomulu ANKA_RA logosu kullaniliyor ({im.size})")
              return im

          img = load_logo()
          w, h = img.size
          side = min(w, h)
          img = ImageOps.fit(img, (side, side), method=Image.Resampling.LANCZOS)

          mipmap_icons = {"ic_launcher", "ic_launcher_round"}
          for mf in glob.glob("fermata/src/**/AndroidManifest.xml", recursive=True):
              if "/test" in mf.replace("\\", "/"):
                  continue
              mtxt = open(mf, encoding="utf-8", errors="ignore").read()
              for m in re.finditer(r'android:(?:icon|roundIcon)="@mipmap/([^"]+)"', mtxt):
                  mipmap_icons.add(m.group(1))

          res_dirs = [d for d in ("fermata/src/main/res", "fermata/src/auto/res") if os.path.isdir(d)]
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          fg_sizes = {"mipmap-mdpi": 108, "mipmap-hdpi": 162, "mipmap-xhdpi": 216, "mipmap-xxhdpi": 324, "mipmap-xxxhdpi": 432}

          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  if not os.path.basename(dp).startswith("mipmap-"):
                      continue
                  for fn in files:
                      stem = os.path.splitext(fn)[0]
                      if stem in mipmap_icons or stem == "anka_ra_ic_fg":
                          os.remove(os.path.join(dp, fn))
              for folder, px in sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  for iname in mipmap_icons:
                      resized.save(os.path.join(out_dir, f"{iname}.png"))
              for folder, px in fg_sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  canvas = Image.new("RGBA", (px, px), (6, 10, 20, 255))
                  inner = int(px * 0.72)
                  fg_icon = img.resize((inner, inner), Image.Resampling.LANCZOS)
                  off = (px - inner) // 2
                  canvas.paste(fg_icon, (off, off), fg_icon)
                  canvas.save(os.path.join(out_dir, "anka_ra_ic_fg.png"))
              anydpi = os.path.join(rdir, "mipmap-anydpi-v26")
              os.makedirs(anydpi, exist_ok=True)
              adaptive_xml = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@color/anka_ra_icon_bg" />\n'
                  '    <foreground android:drawable="@mipmap/anka_ra_ic_fg" />\n'
                  '</adaptive-icon>\n'
              )
              for iname in mipmap_icons:
                  open(os.path.join(anydpi, f"{iname}.xml"), "w", encoding="utf-8").write(adaptive_xml)
              val_dir = os.path.join(rdir, "values")
              os.makedirs(val_dir, exist_ok=True)
              open(os.path.join(val_dir, "anka_ra_colors.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="anka_ra_icon_bg">#060A14</color>\n'
                  '    <color name="anka_ra_bg">#060A14</color>\n'
                  '    <color name="anka_ra_surface">#10192C</color>\n'
                  '    <color name="anka_ra_surface_elevated">#16233E</color>\n'
                  '    <color name="anka_ra_cyan">#00C2FF</color>\n'
                  '    <color name="anka_ra_crimson">#FF3D2E</color>\n'
                  '    <color name="anka_ra_gold">#FBBF24</color>\n'
                  '    <color name="anka_ra_glass_stroke">#4000C2FF</color>\n'
                  '    <color name="anka_ra_text_primary">#F8FAFC</color>\n'
                  '    <color name="anka_ra_text_secondary">#94A3B8</color>\n'
                  '</resources>\n'
              )
          print("OK: ANKA_RA logosu ve renk paleti eklendi.")

          # =========================================================
          # 3) ANKA_RA MODERN GLASS UI TEMA & DRAWABLE YENILEMESI
          # =========================================================
          def remap_hex_color(name_l, hex_val):
              raw = hex_val.lstrip("#")
              if len(raw) == 6:
                  alpha, rgb = "", raw.upper()
              elif len(raw) == 8:
                  alpha, rgb = raw[:2].upper(), raw[2:].upper()
              else:
                  return hex_val
              if alpha in ("00",):
                  return hex_val
              if any(k in name_l for k in ("text", "title", "subtitle", "white", "black", "transparent", "error", "red", "green", "success", "warning")):
                  return hex_val
              if any(k in name_l for k in ("window_bg", "windowbackground", "screen_bg", "root_bg", "canvas_bg", "scaffold", "bg_dark", "glass_bg", "background_dark", "dark_bg", "main_bg")):
                  return "#" + alpha + "060A14"
              if any(k in name_l for k in ("card_bg", "card_surface", "tile_bg", "panel_bg", "surface", "dock", "navbar", "nav_bg", "bottom_bar", "toolbar_bg", "header_bg", "sheet_bg", "player_bg")):
                  return "#" + alpha + "10192C"
              if any(k in name_l for k in ("stroke", "border", "outline")):
                  return "#4000C2FF" if alpha else "#1E3A5F"
              if any(k in name_l for k in ("accent", "primary", "active", "selected", "checked", "highlight", "cyan", "teal", "tint", "fab", "play_btn")):
                  if "dark" in name_l or "bg" in name_l:
                      return "#" + alpha + "0B1324"
                  return "#" + alpha + "00C2FF"
              if any(k in name_l for k in ("star", "favorite", "fav_")):
                  return "#" + alpha + "FBBF24"
              return hex_val

          ui_color_files = 0
          ui_drawable_files = 0
          color_tag_pat = re.compile(r'(<color\s+name="([^"]+)"[^>]*>\s*)(#[0-9a-fA-F]{6,8})(\s*</color>)')

          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if not fn.endswith(".xml") or fn == "anka_ra_colors.xml":
                          continue
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if bname.startswith("values"):
                          def _rep_col(m):
                              new_c = remap_hex_color(m.group(2).lower(), m.group(3))
                              return m.group(1) + new_c + m.group(4)
                          new_txt = color_tag_pat.sub(_rep_col, orig)
                          if "theme" in fn.lower() or "style" in fn.lower() or "glass" in fn.lower():
                              new_txt = re.sub(
                                  r'(<item\s+name="(?:android:)?windowBackground">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)',
                                  r'\g<1>#060A14\g<2>',
                                  new_txt
                              )
                              new_txt = re.sub(
                                  r'(<item\s+name="(?:colorAccent|colorPrimary|colorSecondary)">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)',
                                  r'\g<1>#00C2FF\g<2>',
                                  new_txt
                              )
                          if safe_write_xml(p, new_txt, orig):
                              ui_color_files += 1
                              print(f"UI Tema/Renk yamalandi: {p}")
                      elif bname.startswith("drawable") and "<shape" in orig:
                          fn_l = fn.lower()
                          new_txt = orig
                          if any(k in fn_l for k in ("card", "tile", "panel", "glass", "addon", "player", "dock", "nav", "pill", "item_bg", "container")):
                              def _bump_radius(m):
                                  val = float(m.group(2))
                                  if 2.0 <= val <= 18.0:
                                      return m.group(1) + "22dp" + m.group(3)
                                  return m.group(0)
                              new_txt = re.sub(r'(android:radius=")(\d+(?:\.\d+)?)dp(")', _bump_radius, new_txt)
                              if "<stroke" in new_txt:
                                  new_txt = re.sub(r'(<stroke\b[^>]*android:color=")#[0-9a-fA-F]{6,8}(")', r'\g<1>#3800C2FF\g<2>', new_txt)
                              new_txt = re.sub(r'(<solid\s+android:color=")#[0-9a-fA-F]{2}(?:1[0-9a-fA-F]|2[0-9a-fA-F]|0[89a-fA-F]){3}(")', r'\g<1>#DC10192C\g<2>', new_txt)
                          if any(k in fn_l for k in ("play_bg", "btn_play", "play_button", "play_pause_bg", "fab_bg")) and "<solid" in new_txt and "<gradient" not in new_txt:
                              new_txt = re.sub(
                                  r'<solid\s+android:color="[^"]+"\s*/>',
                                  '<gradient android:angle="315" android:startColor="#00C2FF" android:endColor="#FF3D2E" android:type="linear" />',
                                  new_txt,
                                  count=1
                              )
                          if safe_write_xml(p, new_txt, orig):
                              ui_drawable_files += 1
                              print(f"UI Glass Drawable yamalandi: {p}")

          print(f"OK: ANKA_RA Modern UI yamasi -> {ui_color_files} tema/renk dosyasi, {ui_drawable_files} glass drawable.")

          # =========================================================
          # 4) KAHVE / KO-FI / BAGIS UYARISINI 3 KAYNAKTAN KALDIR
          # =========================================================
          banner_java = "fermata/src/main/java/me/aap/fermata/ui/view/PhoneSupportBannerController.java"
          if os.path.isfile(banner_java):
              src = open(banner_java, encoding="utf-8").read()
              new_src = re.sub(
                  r'\.setVisibility\(\s*(?:(?:android\.view\.)?View\.)?VISIBLE\s*\)',
                  '.setVisibility(android.view.View.GONE)',
                  src
              )
              void_pat = re.compile(r'(\bvoid\s+(?:show|maybeShow|display|schedule|attach|bind|start|init|onStart|onResume)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*\{)')
              new_src = void_pat.sub(r'\1 if (true) return; ', new_src)
              if new_src != src:
                  open(banner_java, "w", encoding="utf-8").write(new_src)
                  print("OK: PhoneSupportBannerController kapatildi.")

          for dp, _, files in os.walk("fermata/src"):
              if "/test" in dp.replace("\\", "/"):
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "layout" in dp:
                      p = os.path.join(dp, fn)
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                      if "support_banner" in txt or "@drawable/coffee" in txt:
                          if 'android:visibility=' in txt:
                              new_txt = re.sub(r'android:visibility="[^"]*"', 'android:visibility="gone"', txt, count=1)
                          else:
                              new_txt = re.sub(r'(<[A-Za-z0-9_.]+\b)', r'\1 android:visibility="gone"', txt, count=1)
                          if safe_write_xml(p, new_txt, txt):
                              print(f"OK: Kahve banner layout gizlendi: {p}")

          nav_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/NavBarMediator.java"
          if os.path.isfile(nav_java):
              src = open(nav_java, encoding="utf-8").read()
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*\)\s*b\.addItem\(\s*R\.id\.nav_donate', 'if (false && BuildConfig.AUTO) b.addItem(R.id.nav_donate', src)
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*&&\s*\(\s*item\.getItemId\(\)\s*==\s*R\.id\.nav_donate\s*\)\s*\)', 'if (false && BuildConfig.AUTO && (item.getItemId() == R.id.nav_donate))', new_src)
              if new_src != src:
                  open(nav_java, "w", encoding="utf-8").write(new_src)
                  print("OK: NavBarMediator kahve menusu kaldirildi.")

          settings_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/SettingsFragment.java"
          if os.path.isfile(settings_java):
              src = open(settings_java, encoding="utf-8").read()
              idx = src.find("R.string.support_kofi_title")
              if idx != -1:
                  brace_open = src.rfind("{", 0, idx)
                  if brace_open != -1 and "->" in src[max(0, brace_open - 25):brace_open]:
                      stmt_start = max(src.rfind(";", 0, brace_open), src.rfind("{", 0, brace_open), src.rfind("}", 0, brace_open)) + 1
                      depth, i = 0, brace_open
                      while i < len(src):
                          if src[i] == "{": depth += 1
                          elif src[i] == "}":
                              depth -= 1
                              if depth == 0: break
                          i += 1
                      semi = src.find(";", i)
                      if semi != -1:
                          stmt = src[stmt_start:semi + 1]
                          new_src = src[:stmt_start] + "\n        if (false) { " + stmt.strip() + " }\n" + src[semi + 1:]
                          open(settings_java, "w", encoding="utf-8").write(new_src)
                          print("OK: SettingsFragment Ko-fi butonu kaldirildi.")

          # =========================================================
          # 5) AUDIOBOOKS, STREMIO VE TIKTOK KARTLARINI DASHBOARD/NAV'DAN GIZLE
          # =========================================================
          hidden_caps_count = 0
          for root in ("fermata/src", "modules"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  norm = dp.replace("\\", "/")
                  if "/test" in norm or "/androidTest" in norm or "/build/" in norm:
                      continue
                  for fn in files:
                      if not fn.endswith((".xml", ".java")):
                          continue
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = orig
                      def _strip_dash_nav(m):
                          q, val = m.group(1), m.group(2)
                          low = val.lower()
                          if any(b in low for b in ("audiobook", "stremio", "tiktok")):
                              parts = [x.strip() for x in val.split(",") if x.strip().lower() not in ("dashboard", "navigation")]
                              if parts != [x.strip() for x in val.split(",")]:
                                  return q + ",".join(parts) + q
                          return m.group(0)
                      new_txt = re.sub(r'(")([^"\n]*(?:dashboard|navigation)[^"\n]*)"', lambda m: _strip_dash_nav(m), new_txt)
                      if new_txt != orig:
                          if fn.endswith(".xml"):
                              if safe_write_xml(p, new_txt, orig):
                                  hidden_caps_count += 1
                                  print(f"Addon dashboard/nav gizlendi (XML): {p}")
                          else:
                              open(p, "w", encoding="utf-8").write(new_txt)
                              hidden_caps_count += 1
                              print(f"Addon dashboard/nav gizlendi (Java): {p}")
          print(f"Toplam gizlenen Audiobook/Stremio/TikTok capability yamasi: {hidden_caps_count}")

          # =========================================================
          # 6) YOUTUBE MUSIC YER IMI + TELEFON MUZIKLERI IZINLERI (ANDROID 13-16)
          # =========================================================
          # 6A) AndroidManifest'e READ_MEDIA_AUDIO, READ_EXTERNAL_STORAGE ve YouTube Music <queries> ekle
          main_manifest = "fermata/src/main/AndroidManifest.xml"
          if os.path.isfile(main_manifest):
              morig = open(main_manifest, encoding="utf-8").read()
              mnew = morig
              for perm in (
                  "android.permission.RECORD_AUDIO",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.READ_MEDIA_AUDIO",
                  "android.permission.READ_EXTERNAL_STORAGE",
              ):
                  if perm not in mnew:
                      mnew = mnew.replace("<application", f'    <uses-permission android:name="{perm}" />\n    <application', 1)

              if "com.google.android.apps.youtube.music" not in mnew:
                  if "<queries>" in mnew:
                      mnew = mnew.replace(
                          "<queries>",
                          '<queries>\n        <package android:name="com.google.android.apps.youtube.music" />',
                          1
                      )
                  else:
                      mnew = mnew.replace(
                          "<application",
                          '    <queries>\n        <package android:name="com.google.android.apps.youtube.music" />\n    </queries>\n    <application',
                          1
                      )

              if safe_write_xml(main_manifest, mnew, morig):
                  print("OK: AndroidManifest READ_MEDIA_AUDIO + YouTube Music queries + mikrofon/konum izinleri eklendi.")

          # 6B) Web / Browser modulu varsayilan yer imlerine YouTube Music (music.youtube.com) ekle
          ytm_bookmarks_added = 0
          for root in ("fermata/src/main", "modules/web/src/main"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if fn.endswith(".xml") and "values" in dp:
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if "https://www.google.com" in orig and "music.youtube.com" not in orig:
                              new_txt = orig.replace(
                                  "https://www.google.com",
                                  "https://music.youtube.com</item>\n        <item>https://www.google.com",
                                  1
                              )
                              if safe_write_xml(p, new_txt, orig):
                                  ytm_bookmarks_added += 1
                                  print(f"OK: YouTube Music yer imi eklendi (XML): {p}")
                      elif fn.endswith(".java"):
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if '"https://www.google.com"' in orig and "music.youtube.com" not in orig:
                              new_txt = orig.replace(
                                  '"https://www.google.com"',
                                  '"https://music.youtube.com", "https://www.google.com"',
                                  1
                              )
                              if new_txt != orig:
                                  open(p, "w", encoding="utf-8").write(new_txt)
                                  ytm_bookmarks_added += 1
                                  print(f"OK: YouTube Music yer imi eklendi (Java): {p}")

          print(f"YouTube Music varsayilan kisayol yamasi: {ytm_bookmarks_added}")

          # =========================================================
          # 7) HACIM ASISTAN & FAVORILER SINIFLARINI EKLE
          # =========================================================
          hacim_dir = "fermata/src/main/java/me/aap/fermata/hacim"
          os.makedirs(hacim_dir, exist_ok=True)
          open(os.path.join(hacim_dir, "HacimAssistant.java"), "w", encoding="utf-8").write(
              base64.b64decode("".join(HACIM_JAVA_B64.split())).decode("utf-8")
          )
          open(os.path.join(hacim_dir, "FavoritesManager.java"), "w", encoding="utf-8").write(
              base64.b64decode("".join(FAV_JAVA_B64.split())).decode("utf-8")
          )
          print("OK: HacimAssistant.java ve FavoritesManager.java guncellendi.")
          PY

      - name: Build Auto Release Bundle (AAB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew :fermata:bundleAutoRelease -PAPP_NAME=ANKA_RA --no-daemon

      - name: Build Single Signed Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          AAB_PATH=$(find fermata/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -path "*/outputs/bundle/*" -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "Hata: .aab dosyasi bulunamadi."
            find . -name "*.aab"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/google/bundletool/releases/latest",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "ANKA-RA-Builder"
              }
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if a["name"].endswith(".jar"))
          urllib.request.urlretrieve(url, os.path.join(os.environ["RUNNER_TEMP"], "bundletool.jar"))
          PY

          mkdir -p signed-apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB_PATH" \
            --output="$RUNNER_TEMP/anka_ra.apks" \
            --mode=universal \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass="pass:$KS_PASS"

          unzip -o "$RUNNER_TEMP/anka_ra.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "signed-apks/ANKA_RA-auto-universal-signed.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "signed-apks/ANKA_RA-auto-universal-signed.apk"
          ls -lh "signed-apks/ANKA_RA-auto-universal-signed.apk"

      - name: Upload Single Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ANKA_RA-auto-universal-apk
          path: signed-apks/ANKA_RA-auto-universal-signed.apk
          retention-days: 30
