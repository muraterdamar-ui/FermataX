                          pill.append(lbl)

                          date_parent.append(pill)

                  merged_speed_card = None
                  for parent in root.iter():
                      children = list(parent)
                      if len(children) >= 3:
                          s0 = subtree_text(children[0])
                          s1 = subtree_text(children[1])
                          if ("speed" in s0 or "km" in s0 or "trip" in s0) and ("weather" in s1 or "temp" in s1 or "forecast" in s1):
                              speed_card = children[0]
                              weather_card = children[1]
                              media_card = children[2]
                              a_attr(speed_card, "layout_weight", "0.42")
                              a_attr(speed_card, "background", "@drawable/an_car_a_card_night")
                              a_attr(speed_card, "tag", "an_car_a_left_card")

                              div = ET.Element("View")
                              a_attr(div, "layout_width", "match_parent")
                              a_attr(div, "layout_height", "1dp")
                              a_attr(div, "layout_marginTop", "8dp")
                              a_attr(div, "layout_marginBottom", "8dp")
                              a_attr(div, "background", "#33FFFFFF")
                              speed_card.append(div)

                              for w_child in list(weather_card):
                                  weather_card.remove(w_child)
                                  speed_card.append(w_child)
                              parent.remove(weather_card)

                              a_attr(media_card, "layout_weight", "0.58")
                              a_attr(media_card, "background", "@drawable/an_car_a_card_night")
                              a_attr(media_card, "tag", "an_car_a_card")
                              merged_speed_card = speed_card
                              break

                  if merged_speed_card is not None:
                      boost_left_card_fonts_xml(merged_speed_card)

                  for el in root.iter():
                      cid = (a_attr(el, "id") or "").lower()
                      ctext = (a_attr(el, "text") or "").lower()
                      if any(k in cid or k in ctext for k in ("permission_hint", "location_hint", "her zaman izin", "always allow")):
                          a_attr(el, "visibility", "gone")
                      if el.tag.endswith("TextView"):
                          ts = a_attr(el, "textSize")
                          if ts and ts.endswith("sp"):
                              try:
                                  val = float(ts[:-2])
                                  if val < 15.0:
                                      a_attr(el, "textSize", "16sp")
                                  elif 15.0 <= val <= 20.0:
                                      a_attr(el, "textSize", f"{int(round(val * 1.18))}sp")
                              except Exception:
                                  pass
                      if any(k in cid for k in ("dock", "shortcut", "quick", "bottom_bar", "nav_item", "tile")):
                          for sub in el.iter():
                              if sub.tag.endswith("ImageView"):
                                  w_str = a_attr(sub, "layout_width") or ""
                                  if w_str.endswith("dp"):
                                      try:
                                          new_dp = int(round(float(w_str[:-2]) * 1.12))
                                          a_attr(sub, "layout_width", f"{new_dp}dp")
                                          a_attr(sub, "layout_height", f"{new_dp}dp")
                                      except Exception:
                                          pass
                                  else:
                                      a_attr(sub, "layout_width", "31dp")
                                      a_attr(sub, "layout_height", "31dp")

                  safe_write_xml(gl_path, ET.tostring(root, encoding="unicode"), orig_xml)
              except Exception as e:
                  print(f"Glass XML yama uyarisi ({gl_path}): {e}")

          for dp, _, files in os.walk("fermata/src/main/java/me/aap/fermata/ui/glass"):
              for fn in files:
                  if not fn.endswith(".java"):
                      continue
                  p = os.path.join(dp, fn)
                  src = open(p, encoding="utf-8").read()
                  new_src = re.sub(r'\baddShortcutTile\s*\(', 'if (false) addShortcutTile(', src)
                  new_src = re.sub(r'(toIntPx\s*\([^,]+,\s*)(2[0-9]|3[0-6])(\s*\))', lambda m: f"{m.group(1)}{int(round(int(m.group(2)) * 1.10))}{m.group(3)}", new_src)
                  # Java icinde kucuk hardcoded sp degerleri (10f-16f) varsa sol kart icin buyut
                  def _boost_java_sp(m):
                      val = float(m.group(2))
                      if 10.0 <= val <= 16.0:
                          return f"{m.group(1)}{val * 1.35:.1f}f{m.group(3)}"
                      return m.group(0)
                  new_src = re.sub(r'(setTextSize\s*\(\s*(?:TypedValue\.COMPLEX_UNIT_SP\s*,\s*)?)(1[0-6](?:\.\d+)?)f(\s*\))', _boost_java_sp, new_src)
                  # onFinishInflate / onViewCreated varsa AnCarAThemeHelper.applyToCockpit cagir
                  if "AnCarAThemeHelper.applyToCockpit" not in new_src:
                      for hook_m in ("onFinishInflate", "onViewCreated"):
                          m_sig = re.search(r'\bvoid\s+' + hook_m + r'\s*\([^)]*\)\s*\{', new_src)
                          if m_sig:
                              m_sup = re.search(r'super\.' + hook_m + r'\s*\([^;]*\)\s*;', new_src[m_sig.end():])
                              ins_p = m_sig.end() + (m_sup.end() if m_sup else 0)
                              target_view = "view" if hook_m == "onViewCreated" else "this"
                              new_src = new_src[:ins_p] + f"\n        me.aap.fermata.hacim.AnCarAThemeHelper.applyToCockpit({target_view});\n" + new_src[ins_p:]
                              break
                  if new_src != src:
                      open(p, "w", encoding="utf-8").write(new_src)
                      print(f"OK: Glass Java font & tema guncellendi: {p}")

          # 5) KAHVE / KO-FI / BAGIS UYARISINI KALDIR
          # =========================================================
          banner_java = "fermata/src/main/java/me/aap/fermata/ui/view/PhoneSupportBannerController.java"
          if os.path.isfile(banner_java):
              src = open(banner_java, encoding="utf-8").read()
              new_src = re.sub(r'\.setVisibility\(\s*(?:(?:android\.view\.)?View\.)?VISIBLE\s*\)', '.setVisibility(android.view.View.GONE)', src)
              void_pat = re.compile(r'(\bvoid\s+(?:show|maybeShow|display|schedule|attach|bind|start|init|onStart|onResume)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*\{)')
              new_src = void_pat.sub(r'\1 if (true) return; ', new_src)
              if new_src != src:
                  open(banner_java, "w", encoding="utf-8").write(new_src)

          for dp, _, files in os.walk("fermata/src"):
              if "/test" in dp.replace("\\", "/"):
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "layout" in dp:
                      p = os.path.join(dp, fn)
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                      if "support_banner" in txt or "@drawable/coffee" in txt:
                          new_txt = re.sub(r'android:visibility="[^"]*"', 'android:visibility="gone"', txt, count=1) if 'android:visibility=' in txt else re.sub(r'(<[A-Za-z0-9_.]+\b)', r'\1 android:visibility="gone"', txt, count=1)
                          safe_write_xml(p, new_txt, txt)

          nav_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/NavBarMediator.java"
          if os.path.isfile(nav_java):
              src = open(nav_java, encoding="utf-8").read()
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*\)\s*b\.addItem\(\s*R\.id\.nav_donate', 'if (false && BuildConfig.AUTO) b.addItem(R.id.nav_donate', src)
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*&&\s*\(\s*item\.getItemId\(\)\s*==\s*R\.id\.nav_donate\s*\)\s*\)', 'if (false && BuildConfig.AUTO && (item.getItemId() == R.id.nav_donate))', new_src)
              if new_src != src:
                  open(nav_java, "w", encoding="utf-8").write(new_src)

          if os.path.isfile(settings_java):
              src = open(settings_java, encoding="utf-8").read()
              idx = src.find("R.string.support_kofi_title")
              if idx != -1:
                  brace_open = src.rfind("{", 0, idx)
                  if brace_open != -1 and "->" in src[max(0, brace_open - 25):brace_open]:
                      stmt_start = max(src.rfind(";", 0, brace_open), src.rfind("{", 0, brace_open), src.rfind("}", 0, brace_open)) + 1
                      depth, i = 0, brace_open
                      while i < len(src):
                          if src[i] == "{": depth += 1
                          elif src[i] == "}":
                              depth -= 1
                              if depth == 0: break
                          i += 1
                      semi = src.find(";", i)
                      if semi != -1:
                          stmt = src[stmt_start:semi + 1]
                          new_src = src[:stmt_start] + "\n        if (false) { " + stmt.strip() + " }\n" + src[semi + 1:]
                          open(settings_java, "w", encoding="utf-8").write(new_src)

          # =========================================================
          # 6) AUDIOBOOKS, STREMIO VE TIKTOK KARTLARINI GIZLE
          # =========================================================
          for root in ("fermata/src", "modules"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  norm = dp.replace("\\", "/")
                  if "/test" in norm or "/androidTest" in norm or "/build/" in norm:
                      continue
                  for fn in files:
                      if not fn.endswith((".xml", ".java")):
                          continue
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      def _strip_dash_nav(m):
                          q, val = m.group(1), m.group(2)
                          low = val.lower()
                          if any(b in low for b in ("audiobook", "stremio", "tiktok")):
                              parts = [x.strip() for x in val.split(",") if x.strip().lower() not in ("dashboard", "navigation")]
                              if parts != [x.strip() for x in val.split(",")]:
                                  return q + ",".join(parts) + q
                          return m.group(0)
                      new_txt = re.sub(r'(")([^"\n]*(?:dashboard|navigation)[^"\n]*)"', lambda m: _strip_dash_nav(m), orig)
                      if new_txt != orig:
                          if fn.endswith(".xml"):
                              safe_write_xml(p, new_txt, orig)
                          else:
                              open(p, "w", encoding="utf-8").write(new_txt)

          # =========================================================
          # 7) YOUTUBE MUSIC YER IMI + HACIM SINIFLARI YAZIMI
          # =========================================================
          for root in ("fermata/src/main", "modules/web/src/main"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if fn.endswith(".xml") and "values" in dp:
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if "https://www.google.com" in orig and "music.youtube.com" not in orig:
                              safe_write_xml(p, orig.replace("https://www.google.com", "https://music.youtube.com</item>\n        <item>https://www.google.com", 1), orig)
                      elif fn.endswith(".java"):
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if '"https://www.google.com"' in orig and "music.youtube.com" not in orig:
                              open(p, "w", encoding="utf-8").write(orig.replace('"https://www.google.com"', '"https://music.youtube.com", "https://www.google.com"', 1))

          hacim_dir = "fermata/src/main/java/me/aap/fermata/hacim"
          os.makedirs(hacim_dir, exist_ok=True)
          open(os.path.join(hacim_dir, "HacimAssistant.java"), "w", encoding="utf-8").write(base64.b64decode("".join(HACIM_JAVA_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "HacimWakeService.java"), "w", encoding="utf-8").write(base64.b64decode("".join(WAKE_SERVICE_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "HacimSetupDialog.java"), "w", encoding="utf-8").write(base64.b64decode("".join(SETUP_DIALOG_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "FavoritesManager.java"), "w", encoding="utf-8").write(base64.b64decode("".join(FAV_JAVA_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "AnCarAThemeHelper.java"), "w", encoding="utf-8").write(base64.b64decode("".join(THEME_HELPER_B64.split())).decode("utf-8"))
          print("OK: Tum Hacim Asistan siniflari yazildi.")

          # =========================================================
          # 8) GERCEK ENTEGRASYON: MainActivity, MainCarActivity & AndroidManifest
          # =========================================================
          def inject_after_super_call(java_src, method_name, hook_code):
              if hook_code.strip() in java_src:
                  return java_src, False
              m_sig = re.search(r'\bvoid\s+' + re.escape(method_name) + r'\s*\([^)]*\)\s*\{', java_src)
              if not m_sig:
                  return java_src, False
              m_sup = re.search(r'super\.' + re.escape(method_name) + r'\s*\([^;]*\)\s*;', java_src[m_sig.end():])
              if m_sup:
                  ins_pos = m_sig.end() + m_sup.end()
              else:
                  ins_pos = m_sig.end()
              return java_src[:ins_pos] + "\n        " + hook_code + "\n" + java_src[ins_pos:], True

          # 8A) Telefon ana aktivitesi (MainActivity.java / PhoneLauncherActivity.java) -> Ilk acilis Ev/Is/Diger Adres + Surekli Dinleme
          for phone_act in ("MainActivity.java", "PhoneLauncherActivity.java"):
              for pf in glob.glob(f"fermata/src/**/{phone_act}", recursive=True):
                  if "/test" in pf.replace("\\", "/"):
                      continue
                  psrc = open(pf, encoding="utf-8").read()
                  pnew, ok1 = inject_after_super_call(
                      psrc,
                      "onCreate",
                      "me.aap.fermata.hacim.HacimAssistant.getInstance(this); me.aap.fermata.hacim.HacimSetupDialog.showIfFirstRun(this);"
                  )
                  pnew, ok2 = inject_after_super_call(
                      pnew,
                      "onResume",
                      "me.aap.fermata.hacim.HacimWakeService.start(this);"
                  )
                  if ok1 or ok2:
                      open(pf, "w", encoding="utf-8").write(pnew)
                      print(f"OK: Telefon aktivitesine Hacim entegre edildi: {pf}")

          # 8B) Android Auto aktivitesi (MainCarActivity.java) -> Baglanti selamlamasi + Varis/Cikis park yeri kaydi
          for cf in glob.glob("fermata/src/**/MainCarActivity.java", recursive=True):
              if "/test" in cf.replace("\\", "/"):
                  continue
              csrc = open(cf, encoding="utf-8").read()
              cnew, ok_c1 = inject_after_super_call(
                  csrc,
                  "onCreate",
                  "me.aap.fermata.hacim.HacimWakeService.start(this); me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoConnected();"
              )
              if not ok_c1:
                  cnew, ok_c1 = inject_after_super_call(
                      cnew,
                      "onStart",
                      "me.aap.fermata.hacim.HacimWakeService.start(this); me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoConnected();"
                  )
              cnew, ok_c2 = inject_after_super_call(
                  cnew,
                  "onDestroy",
                  "me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoDisconnected();"
              )
              if not ok_c2 and "onAndroidAutoDisconnected" not in cnew:
                  last_brace = cnew.rfind("}")
                  if last_brace != -1:
                      destroy_method = (
                          "\n    @Override\n"
                          "    protected void onDestroy() {\n"
                          "        me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoDisconnected();\n"
                          "        super.onDestroy();\n"
                          "    }\n"
                      )
                      cnew = cnew[:last_brace] + destroy_method + cnew[last_brace:]
                      ok_c2 = True
              if ok_c1 or ok_c2:
                  open(cf, "w", encoding="utf-8").write(cnew)
                  print(f"OK: MainCarActivity'ye Hacim AA baglanti & varis entegre edildi: {cf}")

          # 8C) AndroidManifest.xml -> Izinler + HacimWakeService kaydi
          main_manifest = "fermata/src/main/AndroidManifest.xml"
          if os.path.isfile(main_manifest):
              morig = open(main_manifest, encoding="utf-8").read()
              mnew = morig
              for perm in (
                  "android.permission.RECORD_AUDIO",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_MICROPHONE",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.READ_MEDIA_AUDIO",
                  "android.permission.READ_EXTERNAL_STORAGE",
              ):
                  if perm not in mnew:
                      mnew = mnew.replace("<application", f'    <uses-permission android:name="{perm}" />\n    <application', 1)

              if "com.google.android.apps.youtube.music" not in mnew:
                  if "<queries>" in mnew:
                      mnew = mnew.replace("<queries>", '<queries>\n        <package android:name="com.google.android.apps.youtube.music" />', 1)
                  else:
                      mnew = mnew.replace("<application", '    <queries>\n        <package android:name="com.google.android.apps.youtube.music" />\n    </queries>\n    <application', 1)

              if "me.aap.fermata.hacim.HacimWakeService" not in mnew:
                  svc_decl = (
                      '        <service\n'
                      '            android:name="me.aap.fermata.hacim.HacimWakeService"\n'
                      '            android:enabled="true"\n'
                      '            android:exported="false"\n'
                      '            android:foregroundServiceType="microphone" />\n'
                      '    </application>'
                  )
                  mnew = mnew.replace("</application>", svc_decl, 1)

              if safe_write_xml(main_manifest, mnew, morig):
                  print("OK: AndroidManifest.xml izinleri ve HacimWakeService eklendi.")
          PY

      - name: Build Auto Release Bundle (AAB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew :fermata:bundleAutoRelease -PAPP_NAME=An_car_a --no-daemon

      - name: Build Single Signed Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          AAB_PATH=$(find fermata/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -path "*/outputs/bundle/*" -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "Hata: .aab dosyasi bulunamadi."
            find . -name "*.aab"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/google/bundletool/releases/latest",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "An-car-a-Builder"
              }
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if a["name"].endswith(".jar"))
          urllib.request.urlretrieve(url, os.path.join(os.environ["RUNNER_TEMP"], "bundletool.jar"))
          PY

          mkdir -p signed-apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB_PATH" \
            --output="$RUNNER_TEMP/an_car_a.apks" \
            --mode=universal \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass="pass:$KS_PASS"

          unzip -o "$RUNNER_TEMP/an_car_a.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "signed-apks/An_car_a-auto-universal-signed.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "signed-apks/An_car_a-auto-universal-signed.apk"
          ls -lh "signed-apks/An_car_a-auto-universal-signed.apk"

      - name: Upload Single Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: An_car_a-auto-universal-apk
          path: signed-apks/An_car_a-auto-universal-signed.apk
          retention-days: 30
