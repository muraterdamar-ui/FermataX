                      elif any(k in cid for k in ("title", "header")):
                          a_attr(el, "textSize", "19sp")
                          a_attr(el, "textStyle", "bold")
                      else:
                          new_sp = max(19, int(round(orig_sp * 1.32))) if orig_sp > 0 else 20
                          a_attr(el, "textSize", f"{new_sp}sp")
                          a_attr(el, "textStyle", "bold")

          for gl_path in glass_layouts:
