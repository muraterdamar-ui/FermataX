          def remap_hex_color(name_l, hex_val):
              raw = hex_val.lstrip("#")
              if len(raw) == 6:
                  alpha, rgb = "", raw.upper()
              elif len(raw) == 8:
                  alpha, rgb = raw[:2].upper(), raw[2:].upper()
              else:
                  return hex_val
              if alpha in ("00",):
                  return hex_val
              if any(k in name_l for k in ("text", "title", "subtitle", "white", "black", "transparent", "error", "red", "green", "success", "warning")):
                  return hex_val
              if any(k in name_l for k in ("window_bg", "windowbackground", "screen_bg", "root_bg", "canvas_bg", "scaffold", "bg_dark", "glass_bg", "background_dark", "dark_bg", "main_bg")):
                  return "#" + alpha + "060A14"
              if any(k in name_l for k in ("card_bg", "card_surface", "tile_bg", "panel_bg", "surface", "dock", "navbar", "nav_bg", "bottom_bar", "toolbar_bg", "header_bg", "sheet_bg", "player_bg")):
                  return "#" + alpha + "10192C"
              if any(k in name_l for k in ("stroke", "border", "outline")):
                  return "#4500C2FF" if alpha else "#1E3A5F"
              if any(k in name_l for k in ("accent", "primary", "active", "selected", "checked", "highlight", "cyan", "teal", "tint", "fab", "play_btn")):
                  if "dark" in name_l or "bg" in name_l:
                      return "#" + alpha + "0B1324"
                  return "#" + alpha + "00C2FF"
              if any(k in name_l for k in ("star", "favorite", "fav_")):
                  return "#" + alpha + "FBBF24"
              return hex_val

          color_tag_pat = re.compile(r'(<color\s+name="([^"]+)"[^>]*>\s*)(#[0-9a-fA-F]{6,8})(\s*</color>)')
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if not fn.endswith(".xml") or fn in ("anka_ra_colors.xml", "an_car_a_card_night.xml", "an_car_a_card_gold.xml"):
                          continue
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if bname.startswith("values"):
                          new_txt = color_tag_pat.sub(lambda m: m.group(1) + remap_hex_color(m.group(2).lower(), m.group(3)) + m.group(4), orig)
                          if "theme" in fn.lower() or "style" in fn.lower() or "glass" in fn.lower():
                              new_txt = re.sub(r'(<item\s+name="(?:android:)?windowBackground">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)', r'\g<1>#060A14\g<2>', new_txt)
                              new_txt = re.sub(r'(<item\s+name="(?:colorAccent|colorPrimary|colorSecondary)">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)', r'\g<1>#00C2FF\g<2>', new_txt)
                          safe_write_xml(p, new_txt, orig)

          # =========================================================
