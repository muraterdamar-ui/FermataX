                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_DARK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.setThemeMode(this, 0);', anew)
                      if anew != asrc:
