name: Build Signed An_car_a Auto & Phone APK (Zero-PC)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Pillow, NumPy & HEIF Support
        run: python3 -m pip install --quiet Pillow numpy pillow-heif

      - name: Generate Keystore and Patch Fork Cert Check
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=An_car_a, O=Personal, C=TR"

          printf "\nstoreFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PATH" "$KS_PASS" "$K_ALIAS" "$KS_PASS" >> local.properties

          python3 -c 'p="settings.gradle"; s=open(p).read(); t="!gradle.ext.approvedUploadCertificatesSha256.contains(fingerprint)"; assert t in s, "Hedef satir bulunamadi"; open(p,"w").write(s.replace(t,"false && "+t,1)); print("OK: sertifika kilidi acildi")'

      - name: Apply An_car_a App Icon, Phone+AA 3-Theme Glass UI, Watermark & Hacim
