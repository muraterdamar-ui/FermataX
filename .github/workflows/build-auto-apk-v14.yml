          def safe_write_xml(path, new_txt, orig_txt):
              if new_txt == orig_txt:
                  return False
              try:
                  ET.fromstring(new_txt.encode("utf-8"))
                  open(path, "w", encoding="utf-8").write(new_txt)
                  return True
              except Exception as e:
                  print(f"XML dogrulama atladi ({path}): {e}")
                  return False

          # =========================================================
          # 1) UYGULAMA ADINI An_car_a YAP + TURKCE KOKPIT & KM/S ETIKETLERI
          # =========================================================
          app_key_pat = re.compile(
              r'(<string\b[^>]*\bname="(?:app_name|app_name_auto|app_name_auto_release|app_name_mobile|app_name_mobile_release|media_service_name|fermata_app_name|launcher_name)"[^>]*>)(.*?)(</string>)',
              re.DOTALL | re.IGNORECASE
          )
          exact_fermata_text_pat = re.compile(
              r'(<string\b[^>]*>)\s*Fermata(?:X)?(?:\s+Auto|\s+Control|\s+Mobile)?\s*(</string>)',
              re.IGNORECASE
          )
          tr_exact_labels = {
              "Open on car": "Araçta Aç",
              "AA disconnected": "AA Bağlı Değil",
              "AA connected": "AA Bağlı",
              "Find Car": "Araç Bul",
              "Addons": "An_car_a",
              "Addon Module": "Medya Modülü",
              "Folders": "Müzikler",
              "Local &amp; external storage": "Telefon hafızasındaki müzik dosyaları",
              "Local & external storage": "Telefon hafızasındaki müzik dosyaları",
              "Saved media collections": "Kayıtlı medya listeleri",
              "Quick access starred tracks": "Yıldızlı hızlı erişim",
              "Phone Apps": "Telefon Uygulamaları",
              "Playlists": "Çalma Listeleri",
              "Favorites": "Favoriler",
              "Recent": "Son Çalınanlar",
              "SPEED &amp; TRIP": "HIZ, SEYAHAT &amp; HAVA",
              "SPEED & TRIP": "HIZ, SEYAHAT &amp; HAVA",
              "HIZ VE SEYAHAT": "HIZ, SEYAHAT &amp; HAVA",
              "BUFFERING...": "ŞU AN ÇALINIYOR",
              "ARABELLEĞE ALINIYOR...": "ŞU AN ÇALINIYOR",
              "KM/H": "KM/S",
              "km/h": "KM/S",
          }

          name_patched = 0
          for dp, _, files in os.walk("fermata/src"):
              norm = dp.replace("\\", "/")
              if "/test" in norm or "/androidTest" in norm:
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "values" in dp:
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = app_key_pat.sub(r'\g<1>' + APP_NAME + r'\g<3>', orig)
                      new_txt = exact_fermata_text_pat.sub(r'\g<1>' + APP_NAME + r'\g<2>', new_txt)
                      if os.path.basename(dp) in ("values", "values-tr"):
                          for eng, tr_val in tr_exact_labels.items():
                              new_txt = re.sub(
                                  r'(<string\b[^>]*>)\s*' + re.escape(eng) + r'\s*(</string>)',
                                  r'\g<1>' + tr_val + r'\g<2>',
                                  new_txt
                              )
                      if safe_write_xml(p, new_txt, orig):
                          name_patched += 1
                  elif fn.endswith(".java"):
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if '"KM/H"' in orig or '"km/h"' in orig:
                          new_j = orig.replace('"KM/H"', '"KM/S"').replace('"km/h"', '"KM/S"')
                          if new_j != orig:
                              open(p, "w", encoding="utf-8").write(new_j)
          print(f"Toplam XML string yamasi: {name_patched}")

          # =========================================================
          # 2) UYGULAMA IKONUNU VE TRANSPARAN ARKA PLAN FILIGRANINI
          #    TUM DIZINLERE ISLE + 3 TEMA DRAWABLE DOSYALARI URET
          # =========================================================
          def load_logo():
              candidates = []
              for pat in ("an_car_a_logo.*", "res/an_car_a_logo.*", ".github/an_car_a_logo.*"):
                  candidates.extend(glob.glob(pat))
              for path in candidates:
                  if not os.path.isfile(path) or os.path.getsize(path) < 500:
                      continue
                  if not path.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".heic", ".avif")):
                      continue
                  try:
                      im = Image.open(path).convert("RGBA")
                      print(f"Repodan ozel An_car_A gorseli yuklendi: {path} ({im.size})")
                      return im
                  except Exception:
                      pass
              raw = base64.b64decode("".join(EMBEDDED_LOGO_B64.split()))
              im = Image.open(io.BytesIO(raw)).convert("RGBA")
              print(f"Gomulu tam Anka + An_car_A logosu yuklendi ({im.size})")
              return im

          img = load_logo()
          w, h = img.size
          side = min(w, h)
          img = ImageOps.fit(img, (side, side), method=Image.Resampling.LANCZOS)

          # 2A) Yuksek cozunurluklu (768x768) transparan arka plan filigrani
          wm_base = img.resize((768, 768), Image.Resampling.LANCZOS).convert("RGBA")
          wm_arr = np.array(wm_base, dtype=np.float32)
          lum = wm_arr[:, :, 0] * 0.299 + wm_arr[:, :, 1] * 0.587 + wm_arr[:, :, 2] * 0.114
          wm_arr[:, :, 3] = np.clip((lum - 13.0) * 1.95, 0, 255) * 0.50
          wm_transparent = Image.fromarray(wm_arr.astype(np.uint8), "RGBA")

          mipmap_icons = {"ic_launcher", "ic_launcher_round"}
          drawable_icons = {"ic_launcher", "ic_launcher_round"}
          for mf in glob.glob("fermata/src/**/AndroidManifest.xml", recursive=True):
              if "/test" in mf.replace("\\", "/"):
                  continue
              mtxt = open(mf, encoding="utf-8", errors="ignore").read()
              for m in re.finditer(r'android:(?:icon|roundIcon)="@(mipmap|drawable)/([^"]+)"', mtxt):
                  if m.group(1) == "mipmap":
                      mipmap_icons.add(m.group(2))
                  else:
                      drawable_icons.add(m.group(2))

          res_dirs = []
          for cand in ("fermata/src/main/res", "fermata/src/auto/res", "fermata/src/autoRelease/res", "fermata/src/release/res"):
              if os.path.isdir(cand) or cand in ("fermata/src/main/res", "fermata/src/auto/res"):
                  os.makedirs(cand, exist_ok=True)
                  res_dirs.append(cand)

          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          fg_sizes = {"mipmap-mdpi": 108, "mipmap-hdpi": 162, "mipmap-xhdpi": 216, "mipmap-xxhdpi": 324, "mipmap-xxxhdpi": 432}

          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  if not (bname.startswith("mipmap-") or bname.startswith("drawable")):
                      continue
                  for fn in files:
                      stem = os.path.splitext(fn)[0]
                      if stem in mipmap_icons or stem in drawable_icons or stem.startswith("ic_launcher") or stem == "anka_ra_ic_fg":
                          os.remove(os.path.join(dp, fn))

              for folder, px in sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  for iname in mipmap_icons:
                      resized.save(os.path.join(out_dir, f"{iname}.png"), format="PNG")

              for folder, px in fg_sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  canvas = Image.new("RGBA", (px, px), (0, 0, 0, 255))
                  inner = int(px * 0.76)
                  fg_icon = img.resize((inner, inner), Image.Resampling.LANCZOS)
                  off = (px - inner) // 2
                  canvas.paste(fg_icon, (off, off), fg_icon)
                  canvas.save(os.path.join(out_dir, "anka_ra_ic_fg.png"), format="PNG")

              anydpi = os.path.join(rdir, "mipmap-anydpi-v26")
              os.makedirs(anydpi, exist_ok=True)
              adaptive_xml = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@color/anka_ra_icon_bg" />\n'
                  '    <foreground android:drawable="@mipmap/anka_ra_ic_fg" />\n'
                  '</adaptive-icon>\n'
              )
              for iname in mipmap_icons:
                  open(os.path.join(anydpi, f"{iname}.xml"), "w", encoding="utf-8").write(adaptive_xml)

              d_xxxhdpi = os.path.join(rdir, "drawable-xxxhdpi")
              os.makedirs(d_xxxhdpi, exist_ok=True)
              img_192 = img.resize((192, 192), Image.Resampling.LANCZOS)
              for dname in drawable_icons:
                  img_192.save(os.path.join(d_xxxhdpi, f"{dname}.png"), format="PNG")

              nodpi_dir = os.path.join(rdir, "drawable-nodpi")
              os.makedirs(nodpi_dir, exist_ok=True)
              wm_transparent.save(os.path.join(nodpi_dir, "an_car_a_watermark.png"), format="PNG")

              # 3 Tema Cam Kart Drawable: 1) Siyah (#B510131A), 2) Siyah/Gold (#BA120F09), 3) Beyaz (#E6FFFFFF)
              draw_dir = os.path.join(rdir, "drawable")
              os.makedirs(draw_dir, exist_ok=True)
              open(os.path.join(draw_dir, "an_car_a_card_black.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#B510131A" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#40FFFFFF" />\n'
                  '</shape>\n'
              )
              open(os.path.join(draw_dir, "an_car_a_card_gold.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#BA120F09" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#80D4AF37" />\n'
                  '</shape>\n'
              )
              open(os.path.join(draw_dir, "an_car_a_card_white.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#E6FFFFFF" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#330F172A" />\n'
                  '</shape>\n'
              )

              val_dir = os.path.join(rdir, "values")
              os.makedirs(val_dir, exist_ok=True)
              open(os.path.join(val_dir, "anka_ra_colors.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <item type="id" name="an_car_a_styled_mode" />\n'
                  '    <item type="id" name="an_car_a_watcher_tag" />\n'
                  '    <color name="anka_ra_icon_bg">#000000</color>\n'
                  '    <color name="anka_ra_bg">#000000</color>\n'
                  '    <color name="anka_ra_surface">#10131A</color>\n'
                  '    <color name="anka_ra_cyan">#38BDF8</color>\n'
                  '    <color name="anka_ra_crimson">#E11D48</color>\n'
                  '    <color name="anka_ra_gold">#F59E0B</color>\n'
                  '    <color name="anka_ra_white_bg">#EEF2F6</color>\n'
                  '</resources>\n'
              )
          print("OK: An_car_A ikonu, transparan filigran ve 3 tema drawable kaynaklari islendi.")

          # =========================================================
          # 3) YALNIZCA 3 TEMA SECENEGI:
          #    1. An_car_A Siyah (Varsayilan)
          #    2. An_car_A Siyah / Gold
          #    3. An_car_A Beyaz
          #    + MAVI ARKA PLAN RENK TANIMLARINI TAMAMEN SIYAHA CEVIR
          # =========================================================
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  if not os.path.basename(dp).startswith("values"):
                      continue
                  for fn in files:
                      if not fn.endswith(".xml") or fn == "anka_ra_colors.xml":
                          continue
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = orig
                      def _trim_theme_array(m):
                          header, body, footer = m.group(1), m.group(2), m.group(3)
                          if "theme" in header.lower():
                              return (
                                  header
                                  + '\n        <item>An_car_A Siyah</item>'
                                  + '\n        <item>An_car_A Siyah / Gold</item>'
                                  + '\n        <item>An_car_A Beyaz</item>\n    '
                                  + footer
                              )
                          return m.group(0)
                      new_txt = re.sub(r'(<string-array\b[^>]*>)(.*?)(</string-array>)', _trim_theme_array, new_txt, flags=re.DOTALL | re.IGNORECASE)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_dark"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_black"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah / Gold\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_light"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Beyaz\g<3>', new_txt, flags=re.DOTALL)
                      # FermataX modern UI kabugu tema isimlerini (Klasik / Material You-Bento / Buzlu Cam) 3 An_car_A temasina cevir
                      new_txt = re.sub(r'(<string\b[^>]*>)\s*(?:Buzlu Cam \(Glassmorphism\)|Frosted Glass \(Glassmorphism\)|Glassmorphism|Buzlu Cam)\s*(</string>)', r'\g<1>An_car_A Siyah\g<2>', new_txt, flags=re.IGNORECASE)
                      new_txt = re.sub(r'(<string\b[^>]*>)\s*Material You\s*/\s*Bento\s*(</string>)', r'\g<1>An_car_A Siyah / Gold\g<2>', new_txt, flags=re.IGNORECASE)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="[^"]*(?:theme|style|ui|shell|classic)[^"]*"[^>]*>)\s*(?:Klasik|Classic)\s*(</string>)', r'\g<1>An_car_A Beyaz\g<2>', new_txt, flags=re.IGNORECASE)
                      safe_write_xml(p, new_txt, orig)

          # MainActivityPrefs sabitlerini bozmadan (duplicate case hatasi olmadan) oku ve varsayilani Siyah yap
          theme_const_vals = {}
          for pf in glob.glob("fermata/src/**/MainActivityPrefs.java", recursive=True):
              src = open(pf, encoding="utf-8").read()
              for m_tc in re.finditer(r'\b(THEME_[A-Z_]+)\s*=\s*(\d+)', src):
                  theme_const_vals[m_tc.group(1)] = int(m_tc.group(2))
              # Varsayilan tema (getTheme) THEME_DARK (An_car_A Siyah) olsun
              new_src = re.sub(r'(getIntPref\s*\(\s*THEME\s*,\s*)(?:THEME_[A-Z_]+|\d+)(\s*\))', r'\g<1>THEME_DARK\g<2>', src)
              if new_src != src:
                  open(pf, "w", encoding="utf-8").write(new_src)
          print(f"MainActivityPrefs tema sabitleri: {theme_const_vals}")

          # SettingsFragment: Sadece 3 tema goster (An_car_A Siyah / Siyah-Gold / Beyaz) ve indeks eslesmesini koru
          settings_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/SettingsFragment.java"
          if os.path.isfile(settings_java):
              s_src = open(settings_java, encoding="utf-8").read()
              s_new = s_src
              # Index tabanli ListPref'te 0=THEME_DARK, 1=THEME_LIGHT, 2=THEME_DAY_NIGHT ise sira bu 3 indekse tam oturur
              uses_values = bool(re.search(r'o\.titles\s*=\s*new\s+int\[\]\s*\{[^}]*theme_dark[^}]*\}[\s\S]{0,220}o\.values\s*=', s_new))
              if uses_values:
                  s_new = re.sub(
                      r'(o\.titles\s*=\s*new\s+int\[\]\s*\{)[^}]*theme_dark[^}]*(\})',
                      r'\g<1>R.string.theme_dark, R.string.theme_black, R.string.theme_light\g<2>',
                      s_new
                  )
                  s_new = re.sub(
                      r'(o\.values\s*=\s*new\s+int\[\]\s*\{)[^}]*THEME_DARK[^}]*(\})',
                      r'\g<1>MainActivityPrefs.THEME_DARK, MainActivityPrefs.THEME_BLACK, MainActivityPrefs.THEME_LIGHT\g<2>',
                      s_new
                  )
              else:
                  # Index bazli: 0 -> Siyah (THEME_DARK), 1 -> Beyaz (THEME_LIGHT), 2 -> Siyah/Gold (THEME_DAY_NIGHT->Gold)
                  if theme_const_vals.get("THEME_LIGHT") == 1:
                      ordered_titles = "R.string.theme_dark, R.string.theme_light, R.string.theme_black"
                  else:
                      ordered_titles = "R.string.theme_dark, R.string.theme_black, R.string.theme_light"
                  s_new = re.sub(
                      r'(o\.titles\s*=\s*new\s+int\[\]\s*\{)[^}]*theme_dark[^}]*(\})',
                      r'\g<1>' + ordered_titles + r'\g<2>',
                      s_new
                  )
              if "HacimSetupDialog.show" not in s_new:
                  target_anchor = "ps.addSubPreferenceSet"
                  idx_a = s_new.find(target_anchor)
                  if idx_a != -1:
                      line_start = s_new.rfind("\n", 0, idx_a) + 1
                      inject_pref = (
                          '        ps.addButtonPref(o -> {\n'
                          '            o.title = R.string.app_name;\n'
                          '            o.onClick = () -> me.aap.fermata.hacim.HacimSetupDialog.show(getContext());\n'
                          '        });\n'
                      )
                      s_new = s_new[:line_start] + inject_pref + s_new[line_start:]
              if s_new != s_src:
                  open(settings_java, "w", encoding="utf-8").write(s_new)
                  print("OK: SettingsFragment 3 tema (Siyah / Siyah-Gold / Beyaz) ve kurulum butonu ayarlandi.")

          for act_name in ("BaseActivity.java", "MainActivity.java", "MainActivityDelegate.java"):
              for af in glob.glob(f"fermata/src/**/{act_name}", recursive=True):
                  if "/test" in af.replace("\\", "/"):
                      continue
                  asrc = open(af, encoding="utf-8").read()
                  if ("THEME_DARK" in asrc or "THEME_BLACK" in asrc) and "syncFromFermataThemePref" not in asrc:
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_DARK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 0);', asrc)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_BLACK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 1);', anew)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_DAY_NIGHT\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 1);', anew)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_LIGHT\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 2);', anew)
                      # THEME_DAY_NIGHT artik Siyah/Gold oldugu icin DayNight stili yerine koyu/siyah stili kullan
                      anew = re.sub(r'R\.style\.AppTheme_DayNight\b', 'R.style.AppTheme_Black', anew)
                      if anew != asrc:
                          open(af, "w", encoding="utf-8").write(anew)
                          print(f"OK: Tema senkronizasyonu eklendi: {af}")

          # Yalnizca gercek mavi arka plan renklerini siyaha/koyu cama cevir (kartlari asla mavi/turkuaz yapma!)
          LEGACY_BLUES = {
              "#0D47A1", "#1565C0", "#1976D2", "#1E88E5", "#2196F3",
              "#002171", "#003C8F", "#3F51B5", "#303F9F", "#1A237E"
          }
          def remap_hex_color(name_l, hex_val):
              raw = hex_val.lstrip("#")
              if len(raw) == 6:
                  alpha, rgb = "", raw.upper()
              elif len(raw) == 8:
                  alpha, rgb = raw[:2].upper(), raw[2:].upper()
              else:
                  return hex_val
              if alpha in ("00",):
                  return hex_val
              if any(k in name_l for k in ("text", "title", "subtitle", "white", "black", "transparent", "error", "red", "green", "success", "warning", "popup", "dialog", "menu")):
                  return hex_val
              if "light" in name_l or "day" in name_l:
                  return hex_val
              if "#" + rgb in LEGACY_BLUES:
                  return "#" + alpha + "09090B"
              if any(k in name_l for k in ("window_bg", "windowbackground", "screen_bg", "root_bg", "canvas_bg", "scaffold", "bg_dark", "glass_bg", "background_dark", "dark_bg", "main_bg", "auto_bg", "car_bg")):
                  return "#" + alpha + "000000"
              if any(k in name_l for k in ("card_bg", "card_surface", "tile_bg", "panel_bg", "surface", "dock", "navbar", "nav_bg", "bottom_bar", "toolbar_bg", "header_bg", "sheet_bg", "player_bg", "container")):
                  return "#B510131A" if alpha else "#121620"
              if any(k in name_l for k in ("stroke", "border", "outline")):
                  return "#40FFFFFF" if alpha else "#262B36"
              if any(k in name_l for k in ("star", "favorite", "fav_")):
                  return "#" + alpha + "FBBF24"
              return hex_val

          color_tag_pat = re.compile(r'(<color\s+name="([^"]+)"[^>]*>\s*)(#[0-9a-fA-F]{6,8})(\s*</color>)')
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if not fn.endswith(".xml") or fn in ("anka_ra_colors.xml", "an_car_a_card_black.xml", "an_car_a_card_gold.xml", "an_car_a_card_white.xml"):
                          continue
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if bname.startswith("values"):
                          new_txt = color_tag_pat.sub(lambda m: m.group(1) + remap_hex_color(m.group(2).lower(), m.group(3)) + m.group(4), orig)
                          if "theme" in fn.lower() or "style" in fn.lower() or "glass" in fn.lower():
                              # Sadece koyu temalardaki windowBackground'u siyah yap; colorPrimary/colorSecondary'yi bozma!
                              new_txt = re.sub(r'(<item\s+name="(?:android:)?windowBackground">)\s*#(?:0[0-9a-fA-F]|1[0-9a-fA-F])[0-9a-fA-F]{4}(\s*</item>)', r'\g<1>#000000\g<2>', new_txt)
                          safe_write_xml(p, new_txt, orig)
                      elif bname.startswith("drawable"):
                          # Ozellik adini (color/startColor/centerColor/endColor) koruyarak koyu mavi tonlari koyu fume cama cevir
                          new_txt = re.sub(
                              r'(android:(?:color|startColor|centerColor|endColor)=)"#(?:[0-9a-fA-F]{2})?(?:0[0-9a-fA-F]|1[0-9a-fA-F])(?:2[0-9a-fA-F]|3[0-9a-fA-F]|4[0-9a-fA-F]|5[0-9a-fA-F])(?:[6-9a-fA-F][0-9a-fA-F])"',
                              r'\1"#B510131A"',
                              orig
                          )
                          safe_write_xml(p, new_txt, orig)

          # =========================================================
          # 4) KOKPIT LAYOUT, SOL KART BIRLESTIRME & TRANSPARAN LOGO
          # =========================================================
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)
          ET.register_namespace("app", "http://schemas.android.com/apk/res-auto")
          ET.register_namespace("tools", "http://schemas.android.com/tools")

          def a_attr(el, name, val=None):
              key = "{" + ANDROID_NS + "}" + name
              if val is None:
                  return el.get(key)
              el.set(key, val)
              return val

          def subtree_text(el):
              parts = []
              for sub in el.iter():
                  for k, v in sub.attrib.items():
                      parts.append(str(v))
              return " ".join(parts).lower()

          def boost_left_card_fonts_xml(card_root):
              for el in card_root.iter():
                  cid = (a_attr(el, "id") or "").lower()
                  ctext = (a_attr(el, "text") or "").strip()
                  if "km/h" in ctext.lower():
                      a_attr(el, "text", re.sub(r"km/h", "KM/S", ctext, flags=re.IGNORECASE))
                      ctext = a_attr(el, "text") or ""
                  ctext_l = ctext.lower()

                  if any(k in cid or k in ctext_l for k in ("permission_hint", "location_hint", "her zaman izin", "always allow")):
                      a_attr(el, "visibility", "gone")
                      continue

                  if "forecast" in cid or "hourly" in cid:
                      if el.tag.endswith("LinearLayout") or el.tag.endswith("GridLayout"):
                          el.tag = "GridLayout"
                          a_attr(el, "columnCount", "2")
                          a_attr(el, "rowCount", "2")
                      for sub in el.iter():
                          if sub.tag.endswith("ImageView"):
                              a_attr(sub, "layout_width", "32dp")
                              a_attr(sub, "layout_height", "32dp")
                          elif sub.tag.endswith("TextView"):
                              st = (a_attr(sub, "text") or "").strip()
                              a_attr(sub, "textSize", "24sp" if "°" in st else "19sp")
                              a_attr(sub, "textStyle", "bold")
                      continue

                  if el.tag.endswith("ImageView"):
                      if any(k in cid for k in ("weather_icon", "icon_weather", "condition_icon")):
                          a_attr(el, "layout_width", "58dp")
                          a_attr(el, "layout_height", "58dp")

                  if el.tag.endswith("TextView"):
                      ts = a_attr(el, "textSize")
                      orig_sp = 0.0
                      if ts and ts.endswith("sp"):
                          try:
                              orig_sp = float(ts[:-2])
                          except Exception:
                              orig_sp = 0.0

                      is_hourly_leaf = any(k in cid for k in ("hour", "forecast_temp", "forecast_time"))
                      is_speed_num = (
                          ("speed" in cid and not any(x in cid for x in ("unit", "label", "title", "header", "card")))
                          or (ctext.isdigit() and len(ctext) <= 3 and orig_sp >= 24.0)
                      )
                      is_main_temp = (
                          (any(k in cid for k in ("temp", "temperature", "degree")) and not is_hourly_leaf and not any(x in cid for x in ("min", "max", "range", "hourly")))
                          or ("°c" in ctext_l and orig_sp >= 22.0)
                      )

                      if is_speed_num:
                          a_attr(el, "textSize", "58sp")
                          a_attr(el, "textStyle", "bold")
                          a_attr(el, "includeFontPadding", "false")
                      elif is_main_temp:
                          a_attr(el, "textSize", "50sp")
                          a_attr(el, "textStyle", "bold")
                          a_attr(el, "includeFontPadding", "false")
                      elif is_hourly_leaf:
                          a_attr(el, "textSize", "24sp" if ("temp" in cid or "°" in ctext) else "19sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("unit", "kmh", "kms")) or ctext_l in ("km/h", "km/s"):
                          a_attr(el, "textSize", "22sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("distance", "eta", "duration", "trip", "arrival", "remaining")):
                          a_attr(el, "textSize", "24sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("condition", "weather_desc", "summary", "city", "location")):
                          a_attr(el, "textSize", "23sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("title", "header")):
                          a_attr(el, "textSize", "20sp")
                          a_attr(el, "textStyle", "bold")
                      else:
                          new_sp = max(21, int(round(orig_sp * 1.32))) if orig_sp > 0 else 22
                          a_attr(el, "textSize", f"{new_sp}sp")
                          a_attr(el, "textStyle", "bold")

          layout_files = []
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  if "layout" not in os.path.basename(dp):
                      continue
                  for fn in files:
                      if fn.endswith(".xml"):
                          layout_files.append(os.path.join(dp, fn))

          for l_path in layout_files:
              try:
                  orig_xml = open(l_path, encoding="utf-8").read()
                  low_xml = orig_xml.lower()
                  is_cockpit = ("glass" in os.path.basename(l_path).lower()) or ("speed" in low_xml and "weather" in low_xml) or ("weather" in low_xml and "forecast" in low_xml)
                  if not is_cockpit:
                      continue

                  root = ET.fromstring(orig_xml.encode("utf-8"))

                  merged_speed_card = None
                  for parent in root.iter():
                      children = list(parent)
                      if len(children) >= 2:
                          sp_idx = next((i for i, ch in enumerate(children) if any(k in subtree_text(ch) for k in ("speed", "km/h", "km/s", "trip"))), None)
                          wt_idx = next((i for i, ch in enumerate(children) if i != sp_idx and any(k in subtree_text(ch) for k in ("weather", "°c", "forecast"))), None)
                          if sp_idx is not None and wt_idx is not None:
                              speed_card = children[sp_idx]
                              weather_card = children[wt_idx]
                              a_attr(speed_card, "layout_weight", "0.42")
                              a_attr(speed_card, "background", "@drawable/an_car_a_card_black")
                              a_attr(speed_card, "tag", "an_car_a_left_card")

                              div = ET.Element("View")
                              a_attr(div, "layout_width", "match_parent")
                              a_attr(div, "layout_height", "1dp")
                              a_attr(div, "layout_marginTop", "8dp")
                              a_attr(div, "layout_marginBottom", "8dp")
                              a_attr(div, "background", "#33FFFFFF")
                              speed_card.append(div)

                              for w_child in list(weather_card):
                                  weather_card.remove(w_child)
                                  speed_card.append(w_child)
                              parent.remove(weather_card)

                              for idx_c, ch in enumerate(list(parent)):
                                  if ch is not speed_card:
                                      a_attr(ch, "layout_weight", "0.58")
                                      a_attr(ch, "background", "@drawable/an_car_a_card_black")
                                      a_attr(ch, "tag", "an_car_a_card")
                              merged_speed_card = speed_card
                              break

                  if merged_speed_card is not None:
                      boost_left_card_fonts_xml(merged_speed_card)

                  for el in root.iter():
                      cid = (a_attr(el, "id") or "").lower()
                      ctext = (a_attr(el, "text") or "")
                      if "km/h" in ctext.lower():
                          a_attr(el, "text", re.sub(r"km/h", "KM/S", ctext, flags=re.IGNORECASE))
                      if any(k in cid or k in ctext.lower() for k in ("permission_hint", "location_hint", "her zaman izin", "always allow")):
                          a_attr(el, "visibility", "gone")
                      if el.tag.endswith("TextView"):
                          ts = a_attr(el, "textSize")
                          if ts and ts.endswith("sp"):
                              try:
                                  val = float(ts[:-2])
                                  if val < 16.0:
                                      a_attr(el, "textSize", "17sp")
                                  elif 16.0 <= val <= 20.0:
                                      a_attr(el, "textSize", f"{int(round(val * 1.20))}sp")
                              except Exception:
                                  pass

                  # Kokpit icerigini bir FrameLayout katmanina sar, arka plani tam siyah (#000000) yap ve EN ARKAYA buyuk transparan An_car_A logosu koy
                  if "an_car_a_bg_watermark" not in orig_xml:
                      orig_root_tag = root.tag
                      orig_attribs = dict(root.attrib)
                      orig_children = list(root)
                      for ch in orig_children:
                          root.remove(ch)

                      root.tag = "FrameLayout"
                      root.attrib.clear()
                      a_attr(root, "layout_width", orig_attribs.get(f"{{{ANDROID_NS}}}layout_width", "match_parent"))
                      a_attr(root, "layout_height", orig_attribs.get(f"{{{ANDROID_NS}}}layout_height", "match_parent"))
                      a_attr(root, "background", "#000000")

                      wm_iv = ET.Element("ImageView")
                      a_attr(wm_iv, "id", "@+id/an_car_a_bg_watermark")
                      a_attr(wm_iv, "layout_width", "500dp")
                      a_attr(wm_iv, "layout_height", "500dp")
                      a_attr(wm_iv, "layout_gravity", "center")
                      a_attr(wm_iv, "src", "@drawable/an_car_a_watermark")
                      a_attr(wm_iv, "scaleType", "fitCenter")
                      a_attr(wm_iv, "alpha", "0.48")
                      a_attr(wm_iv, "tag", "an_car_a_watermark")
                      root.append(wm_iv)

                      inner_container = ET.Element(orig_root_tag, orig_attribs)
                      a_attr(inner_container, "layout_width", "match_parent")
                      a_attr(inner_container, "layout_height", "match_parent")
                      a_attr(inner_container, "background", "#00000000")
                      for ch in orig_children:
                          inner_container.append(ch)
                      root.append(inner_container)

                  if safe_write_xml(l_path, ET.tostring(root, encoding="unicode"), orig_xml):
                      print(f"OK: Kokpit layout + tam siyah arka plan & An_car_A filigrani islendi: {l_path}")
              except Exception as e:
                  print(f"Layout yama uyarisi ({l_path}): {e}")

          for dp, _, files in os.walk("fermata/src/main/java/me/aap/fermata/ui/glass"):
              for fn in files:
                  if not fn.endswith(".java"):
                      continue
                  p = os.path.join(dp, fn)
                  src = open(p, encoding="utf-8").read()
                  new_src = src.replace('"KM/H"', '"KM/S"').replace('"km/h"', '"KM/S"')
                  new_src = re.sub(r'\baddShortcutTile\s*\(', 'if (false) addShortcutTile(', new_src)
                  new_src = re.sub(r'(toIntPx\s*\([^,]+,\s*)(2[0-9]|3[0-6])(\s*\))', lambda m: f"{m.group(1)}{int(round(int(m.group(2)) * 1.10))}{m.group(3)}", new_src)
                  def _boost_java_sp(m):
                      val = float(m.group(2))
                      if 10.0 <= val <= 16.0:
                          return f"{m.group(1)}{val * 1.35:.1f}f{m.group(3)}"
                      return m.group(0)
                  new_src = re.sub(r'(setTextSize\s*\(\s*(?:TypedValue\.COMPLEX_UNIT_SP\s*,\s*)?)(1[0-6](?:\.\d+)?)f(\s*\))', _boost_java_sp, new_src)
                  # Hardcoded mavi renkleri siyaha cek
                  new_src = re.sub(r'Color\.parseColor\(\s*"#(?:[0-9a-fA-F]{2})?(?:0[0-9a-fA-F]|1[0-9a-fA-F])(?:2[0-9a-fA-F]|3[0-9a-fA-F]|4[0-9a-fA-F]|5[0-9a-fA-F])(?:[6-9a-fA-F][0-9a-fA-F])"\s*\)', 'Color.parseColor("#000000")', new_src)
                  if "AnCarAThemeHelper.applyToCockpit" not in new_src:
                      for hook_m in ("onFinishInflate", "onViewCreated"):
                          m_sig = re.search(r'\bvoid\s+' + hook_m + r'\s*\([^)]*\)\s*\{', new_src)
                          if m_sig:
                              m_sup = re.search(r'super\.' + hook_m + r'\s*\([^;]*\)\s*;', new_src[m_sig.end():])
                              ins_p = m_sig.end() + (m_sup.end() if m_sup else 0)
                              target_view = "view" if hook_m == "onViewCreated" else "this"
                              new_src = new_src[:ins_p] + f"\n        me.aap.fermata.hacim.AnCarAThemeHelper.applyToCockpit({target_view});\n" + new_src[ins_p:]
                              break
                  if new_src != src:
                      open(p, "w", encoding="utf-8").write(new_src)

          # =========================================================
          # 5) KAHVE / KO-FI / BAGIS UYARISINI KALDIR
          # =========================================================
          banner_java = "fermata/src/main/java/me/aap/fermata/ui/view/PhoneSupportBannerController.java"
          if os.path.isfile(banner_java):
              src = open(banner_java, encoding="utf-8").read()
              new_src = re.sub(r'\.setVisibility\(\s*(?:(?:android\.view\.)?View\.)?VISIBLE\s*\)', '.setVisibility(android.view.View.GONE)', src)
              void_pat = re.compile(r'(\bvoid\s+(?:show|maybeShow|display|schedule|attach|bind|start|init|onStart|onResume)[A-Za-z0-9_]*\s*\([^;{)]*\)\s*\{)')
              new_src = void_pat.sub(r'\1 if (true) return; ', new_src)
              if new_src != src:
                  open(banner_java, "w", encoding="utf-8").write(new_src)

          for dp, _, files in os.walk("fermata/src"):
              if "/test" in dp.replace("\\", "/"):
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "layout" in dp:
                      p = os.path.join(dp, fn)
                      txt = open(p, encoding="utf-8", errors="ignore").read()
                      if "support_banner" in txt or "@drawable/coffee" in txt:
                          new_txt = re.sub(r'android:visibility="[^"]*"', 'android:visibility="gone"', txt, count=1) if 'android:visibility=' in txt else re.sub(r'(<[A-Za-z0-9_.]+\b)', r'\1 android:visibility="gone"', txt, count=1)
                          safe_write_xml(p, new_txt, txt)

          nav_java = "fermata/src/main/java/me/aap/fermata/ui/fragment/NavBarMediator.java"
          if os.path.isfile(nav_java):
              src = open(nav_java, encoding="utf-8").read()
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*\)\s*b\.addItem\(\s*R\.id\.nav_donate', 'if (false && BuildConfig.AUTO) b.addItem(R.id.nav_donate', src)
              new_src = re.sub(r'if\s*\(\s*BuildConfig\.AUTO\s*&&\s*\(\s*item\.getItemId\(\)\s*==\s*R\.id\.nav_donate\s*\)\s*\)', 'if (false && BuildConfig.AUTO && (item.getItemId() == R.id.nav_donate))', new_src)
              if new_src != src:
                  open(nav_java, "w", encoding="utf-8").write(new_src)

          if os.path.isfile(settings_java):
              src = open(settings_java, encoding="utf-8").read()
              idx = src.find("R.string.support_kofi_title")
              if idx != -1:
                  brace_open = src.rfind("{", 0, idx)
                  if brace_open != -1 and "->" in src[max(0, brace_open - 25):brace_open]:
                      stmt_start = max(src.rfind(";", 0, brace_open), src.rfind("{", 0, brace_open), src.rfind("}", 0, brace_open)) + 1
                      depth, i = 0, brace_open
                      while i < len(src):
                          if src[i] == "{": depth += 1
                          elif src[i] == "}":
                              depth -= 1
                              if depth == 0: break
                          i += 1
                      semi = src.find(";", i)
                      if semi != -1:
                          stmt = src[stmt_start:semi + 1]
                          new_src = src[:stmt_start] + "\n        if (false) { " + stmt.strip() + " }\n" + src[semi + 1:]
                          open(settings_java, "w", encoding="utf-8").write(new_src)

          # =========================================================
          # 6) AUDIOBOOKS, STREMIO VE TIKTOK KARTLARINI GIZLE
          # =========================================================
          for root in ("fermata/src", "modules"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  norm = dp.replace("\\", "/")
                  if "/test" in norm or "/androidTest" in norm or "/build/" in norm:
                      continue
                  for fn in files:
                      if not fn.endswith((".xml", ".java")):
                          continue
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      def _strip_dash_nav(m):
                          q, val = m.group(1), m.group(2)
                          low = val.lower()
                          if any(b in low for b in ("audiobook", "stremio", "tiktok")):
                              parts = [x.strip() for x in val.split(",") if x.strip().lower() not in ("dashboard", "navigation")]
                              if parts != [x.strip() for x in val.split(",")]:
                                  return q + ",".join(parts) + q
                          return m.group(0)
                      new_txt = re.sub(r'(")([^"\n]*(?:dashboard|navigation)[^"\n]*)"', lambda m: _strip_dash_nav(m), orig)
                      if new_txt != orig:
                          if fn.endswith(".xml"):
                              safe_write_xml(p, new_txt, orig)
                          else:
                              open(p, "w", encoding="utf-8").write(new_txt)

          # =========================================================
          # 7) YOUTUBE MUSIC YER IMI + HACIM SINIFLARI YAZIMI
          # =========================================================
          for root in ("fermata/src/main", "modules/web/src/main"):
              if not os.path.isdir(root):
                  continue
              for dp, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if fn.endswith(".xml") and "values" in dp:
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if "https://www.google.com" in orig and "music.youtube.com" not in orig:
                              safe_write_xml(p, orig.replace("https://www.google.com", "https://music.youtube.com</item>\n        <item>https://www.google.com", 1), orig)
                      elif fn.endswith(".java"):
                          orig = open(p, encoding="utf-8", errors="ignore").read()
                          if '"https://www.google.com"' in orig and "music.youtube.com" not in orig:
                              open(p, "w", encoding="utf-8").write(orig.replace('"https://www.google.com"', '"https://music.youtube.com", "https://www.google.com"', 1))

          hacim_dir = "fermata/src/main/java/me/aap/fermata/hacim"
          os.makedirs(hacim_dir, exist_ok=True)
          open(os.path.join(hacim_dir, "HacimAssistant.java"), "w", encoding="utf-8").write(base64.b64decode("".join(HACIM_JAVA_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "HacimWakeService.java"), "w", encoding="utf-8").write(base64.b64decode("".join(WAKE_SERVICE_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "HacimSetupDialog.java"), "w", encoding="utf-8").write(base64.b64decode("".join(SETUP_DIALOG_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "FavoritesManager.java"), "w", encoding="utf-8").write(base64.b64decode("".join(FAV_JAVA_B64.split())).decode("utf-8"))
          open(os.path.join(hacim_dir, "AnCarAThemeHelper.java"), "w", encoding="utf-8").write(base64.b64decode("".join(THEME_HELPER_B64.split())).decode("utf-8"))
          print("OK: Tum Hacim Asistan & 3-Tema siniflari yazildi.")

          # =========================================================
          # 8) GERCEK ENTEGRASYON: MainActivity, Car/Auto Activities & Manifest
          # =========================================================
          def inject_after_super_call(java_src, method_name, hook_code):
              if hook_code.strip() in java_src:
                  return java_src, False
              m_sig = re.search(r'\bvoid\s+' + re.escape(method_name) + r'\s*\([^)]*\)\s*\{', java_src)
              if not m_sig:
                  return java_src, False
              m_sup = re.search(r'super\.' + re.escape(method_name) + r'\s*\([^;]*\)\s*;', java_src[m_sig.end():])
              if m_sup:
                  ins_pos = m_sig.end() + m_sup.end()
              else:
                  ins_pos = m_sig.end()
              return java_src[:ins_pos] + "\n        " + hook_code + "\n" + java_src[ins_pos:], True

          # 8-0) GenericDialogFragment'a guvenli Kaydet (anCarATriggerSave) metodu ekle
          for gdf in glob.glob("**/GenericDialogFragment.java", recursive=True):
              norm_g = gdf.replace("\\", "/")
              if "/test" in norm_g or "/build/" in norm_g:
                  continue
              gsrc = open(gdf, encoding="utf-8", errors="ignore").read()
              if "anCarATriggerSave" not in gsrc:
                  # Dialog onay metodunu tespit et (onClick / confirm / ok / dialogConsumer)
                  save_body = None
                  if re.search(r'\bvoid\s+onClick\s*\(\s*FloatingButton\b', gsrc):
                      save_body = "onClick((me.aap.utils.ui.view.FloatingButton) null); return true;"
                  elif re.search(r'\bvoid\s+confirm\s*\(\s*\)', gsrc):
                      save_body = "confirm(); return true;"
                  elif "dialogConsumer" in gsrc:
                      save_body = "if (dialogConsumer != null) { dialogConsumer.run(); return true; } return false;"
                  if save_body:
                      last_brace = gsrc.rfind("}")
                      if last_brace != -1:
                          inject_m = (
                              "\n    public boolean anCarATriggerSave() {\n"
                              "        try { " + save_body + " } catch (Throwable t) { return false; }\n"
                              "    }\n"
                          )
                          open(gdf, "w", encoding="utf-8").write(gsrc[:last_brace] + inject_m + gsrc[last_brace:])
                          print(f"OK: GenericDialogFragment'a anCarATriggerSave() eklendi: {gdf}")

          # 8-0B) FermataX telefon tema secicisinde Bento/Klasik'e gecisi engelleyip 3 An_car_A temasina yonlendir
          for jf in glob.glob("fermata/src/**/*.java", recursive=True):
              norm_j = jf.replace("\\", "/")
              if "/test" in norm_j or "/hacim/" in norm_j:
                  continue
              jsrc = open(jf, encoding="utf-8", errors="ignore").read()
              # FermataX'in kendi AppTheme / UiTheme / GlassMode secicisini tespit et ve logla
              if ("GLASS" in jsrc and "BENTO" in jsrc) or ("glassmorphism" in jsrc.lower() and "bento" in jsrc.lower()):
                  print(f"INFO: FermataX UI tema dosyasi bulundu: {jf}")

          # 8A) Application sinifina global ActivityLifecycleCallbacks bagla (FermataX'in tum telefon/ayar/AA aktivitelerini otomatik yakalar)
          app_hooked = 0
          for app_f in glob.glob("fermata/src/**/*.java", recursive=True):
              norm_a = app_f.replace("\\", "/")
              if "/test" in norm_a or "/hacim/" in norm_a:
                  continue
              asrc = open(app_f, encoding="utf-8", errors="ignore").read()
              if re.search(r'\bextends\s+(?:[A-Za-z0-9_.]*\.)?(?:Application|MultiDexApplication|FermataApplication)\b', asrc):
                  anew, ok_a = inject_after_super_call(
                      asrc,
                      "onCreate",
                      "me.aap.fermata.hacim.AnCarAThemeHelper.installGlobalLifecycleHooks(this);"
                  )
                  if ok_a:
                      open(app_f, "w", encoding="utf-8").write(anew)
                      app_hooked += 1
                      print(f"OK: Global ActivityLifecycleCallbacks baglandi: {app_f}")
          print(f"Global Application hook sayisi: {app_hooked}")

          for phone_act in ("MainActivity.java", "PhoneLauncherActivity.java"):
              for pf in glob.glob(f"fermata/src/**/{phone_act}", recursive=True):
                  if "/test" in pf.replace("\\", "/"):
                      continue
                  psrc = open(pf, encoding="utf-8").read()
                  pnew, ok1 = inject_after_super_call(
                      psrc,
                      "onCreate",
                      "try { me.aap.fermata.hacim.HacimAssistant.getInstance(this); me.aap.fermata.hacim.HacimSetupDialog.showIfFirstRun(this); } catch (Throwable ignored) {}"
                  )
                  pnew, ok2 = inject_after_super_call(
                      pnew,
                      "onPostCreate",
                      "me.aap.fermata.hacim.AnCarAThemeHelper.applyToPhoneActivity(this);"
                  )
                  pnew, ok3 = inject_after_super_call(
                      pnew,
                      "onStart",
                      "me.aap.fermata.hacim.AnCarAThemeHelper.applyToPhoneActivity(this);"
                  )
                  pnew, ok4 = inject_after_super_call(
                      pnew,
                      "onResume",
                      "try { me.aap.fermata.hacim.HacimWakeService.start(this); me.aap.fermata.hacim.AnCarAThemeHelper.applyToPhoneActivity(this); } catch (Throwable ignored) {}"
                  )
                  ok5 = False
                  if ok1 or ok2 or ok3 or ok4 or ok5:
                      open(pf, "w", encoding="utf-8").write(pnew)
                      print(f"OK: Telefon aktivitesine 3-tema AA cam arayuzu & Hacim entegre edildi: {pf}")

          for delegate_file in ("MainActivityDelegate.java", "BaseActivity.java"):
              for df in glob.glob(f"fermata/src/**/{delegate_file}", recursive=True):
                  if "/test" in df.replace("\\", "/"):
                      continue
                  dsrc = open(df, encoding="utf-8").read()
                  dnew = dsrc
                  changed = False
                  for m_name in ("onActivityResume", "onResume", "onActivityStart"):
                      dnew, ok_m = inject_after_super_call(
                          dnew,
                          m_name,
                          "me.aap.fermata.hacim.AnCarAThemeHelper.applyToPhoneHostIfPossible(this);"
                      )
                      changed = changed or ok_m
                  if changed:
                      open(df, "w", encoding="utf-8").write(dnew)
                      print(f"OK: Telefon delegate/base sinifina 3-tema cam arayuzu baglandi: {df}")

          for cf in glob.glob("fermata/src/**/*Car*.java", recursive=True) + glob.glob("fermata/src/**/*Auto*.java", recursive=True):
              norm_c = cf.replace("\\", "/")
              if "/test" in norm_c or "/hacim/" in norm_c:
                  continue
              csrc = open(cf, encoding="utf-8", errors="ignore").read()
              if "class " not in csrc:
                  continue
              is_ctx_subclass = bool(re.search(r'\bextends\s+(?:[A-Za-z0-9_.]*\.)?(?:AppCompatActivity|FragmentActivity|BaseActivity|MainActivity|CarActivity|Activity|ContextWrapper|Service)\b', csrc))
              if is_ctx_subclass:
                  hook_create = "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this); me.aap.fermata.hacim.HacimWakeService.start(this); me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoConnected();"
                  hook_destroy = "me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoDisconnected();"
              else:
                  hook_create = "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this); me.aap.fermata.hacim.AnCarAThemeHelper.startWakeIfPossible(this); me.aap.fermata.hacim.AnCarAThemeHelper.onAutoConnectedIfPossible(this);"
                  hook_destroy = "me.aap.fermata.hacim.AnCarAThemeHelper.onAutoDisconnectedIfPossible(this);"

              cnew, ok_c1 = inject_after_super_call(csrc, "onCreate", hook_create)
              if not ok_c1:
                  cnew, ok_c1 = inject_after_super_call(cnew, "onStart", hook_create)
              cnew, ok_c2 = inject_after_super_call(
                  cnew,
                  "onResume",
                  "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this);"
              )
              cnew, ok_c3 = inject_after_super_call(cnew, "onDestroy", hook_destroy)
              if ok_c1 or ok_c2 or ok_c3:
                  open(cf, "w", encoding="utf-8").write(cnew)
                  print(f"OK: AA/Car sinifina tip guvenli transparan logo & Hacim eklendi: {cf}")

          main_manifest = "fermata/src/main/AndroidManifest.xml"
          if os.path.isfile(main_manifest):
              morig = open(main_manifest, encoding="utf-8").read()
              mnew = morig
              for perm in (
                  "android.permission.RECORD_AUDIO",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_MICROPHONE",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.READ_MEDIA_AUDIO",
                  "android.permission.READ_EXTERNAL_STORAGE",
              ):
                  if perm not in mnew:
                      mnew = mnew.replace("<application", f'    <uses-permission android:name="{perm}" />\n    <application', 1)

              if "com.google.android.apps.youtube.music" not in mnew:
                  if "<queries>" in mnew:
                      mnew = mnew.replace("<queries>", '<queries>\n        <package android:name="com.google.android.apps.youtube.music" />', 1)
                  else:
                      mnew = mnew.replace("<application", '    <queries>\n        <package android:name="com.google.android.apps.youtube.music" />\n    </queries>\n    <application', 1)

              if "me.aap.fermata.hacim.HacimWakeService" not in mnew:
                  svc_decl = (
                      '        <service\n'
                      '            android:name="me.aap.fermata.hacim.HacimWakeService"\n'
                      '            android:enabled="true"\n'
                      '            android:exported="false"\n'
                      '            android:foregroundServiceType="microphone" />\n'
                      '    </application>'
                  )
                  mnew = mnew.replace("</application>", svc_decl, 1)

              if safe_write_xml(main_manifest, mnew, morig):
                  print("OK: AndroidManifest.xml izinleri ve HacimWakeService eklendi.")
          PY

      - name: Build Auto Release Bundle (AAB)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FERMATAX_STORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FERMATAX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FERMATAX_STORE_PASSWORD: FermataHacim2026
          FERMATAX_KEYSTORE_PASSWORD: FermataHacim2026
          FERMATAX_KEY_ALIAS: fermata
          FERMATAX_ALIAS: fermata
          FERMATAX_KEY_PASSWORD: FermataHacim2026
        run: ./gradlew :fermata:bundleAutoRelease -PAPP_NAME=An_car_a --no-daemon

      - name: Build Single Signed Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.jks"
          KS_PASS="FermataHacim2026"
          K_ALIAS="fermata"

          AAB_PATH=$(find fermata/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -path "*/outputs/bundle/*" -name "*.aab" | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "Hata: .aab dosyasi bulunamadi."
            find . -name "*.aab"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/google/bundletool/releases/latest",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "An-car-a-Builder"
              }
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          url = next(a["browser_download_url"] for a in data["assets"] if a["name"].endswith(".jar"))
          urllib.request.urlretrieve(url, os.path.join(os.environ["RUNNER_TEMP"], "bundletool.jar"))
          PY

          mkdir -p signed-apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB_PATH" \
            --output="$RUNNER_TEMP/an_car_a.apks" \
            --mode=universal \
            --ks="$KS_PATH" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass="pass:$KS_PASS"

          unzip -o "$RUNNER_TEMP/an_car_a.apks" universal.apk -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/universal.apk" "signed-apks/An_car_a-auto-universal-signed.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "signed-apks/An_car_a-auto-universal-signed.apk"
          ls -lh "signed-apks/An_car_a-auto-universal-signed.apk"

      - name: Upload Single Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: An_car_a-auto-universal-apk
          path: signed-apks/An_car_a-auto-universal-signed.apk
          retention-days: 30
