                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_BLACK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.setThemeMode(this, 1);', anew)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_LIGHT\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.setThemeMode(this, 2);', anew)
