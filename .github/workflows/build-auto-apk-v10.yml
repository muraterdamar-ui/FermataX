          def safe_write_xml(path, new_txt, orig_txt):
              if new_txt == orig_txt:
                  return False
              try:
                  ET.fromstring(new_txt.encode("utf-8"))
                  open(path, "w", encoding="utf-8").write(new_txt)
                  return True
              except Exception as e:
                  print(f"XML dogrulama atladi ({path}): {e}")
                  return False

          # =========================================================
          # 1) UYGULAMA ADINI An_car_a YAP + TURKCE KOKPIT & KM/S ETIKETLERI
          # =========================================================
          app_key_pat = re.compile(
              r'(<string\b[^>]*\bname="(?:app_name|app_name_auto|app_name_auto_release|app_name_mobile|app_name_mobile_release|media_service_name|fermata_app_name|launcher_name)"[^>]*>)(.*?)(</string>)',
              re.DOTALL | re.IGNORECASE
          )
          exact_fermata_text_pat = re.compile(
              r'(<string\b[^>]*>)\s*Fermata(?:X)?(?:\s+Auto|\s+Control|\s+Mobile)?\s*(</string>)',
              re.IGNORECASE
          )
          tr_exact_labels = {
              "Open on car": "Araçta Aç",
              "AA disconnected": "AA Bağlı Değil",
              "AA connected": "AA Bağlı",
              "Find Car": "Araç Bul",
              "Addons": "An_car_a",
              "Addon Module": "Medya Modülü",
              "Folders": "Müzikler",
              "Local &amp; external storage": "Telefon hafızasındaki müzik dosyaları",
              "Local & external storage": "Telefon hafızasındaki müzik dosyaları",
              "Saved media collections": "Kayıtlı medya listeleri",
              "Quick access starred tracks": "Yıldızlı hızlı erişim",
              "Phone Apps": "Telefon Uygulamaları",
              "Playlists": "Çalma Listeleri",
              "Favorites": "Favoriler",
              "Recent": "Son Çalınanlar",
              "SPEED &amp; TRIP": "HIZ, SEYAHAT &amp; HAVA",
              "SPEED & TRIP": "HIZ, SEYAHAT &amp; HAVA",
              "HIZ VE SEYAHAT": "HIZ, SEYAHAT &amp; HAVA",
              "BUFFERING...": "ŞU AN ÇALINIYOR",
              "ARABELLEĞE ALINIYOR...": "ŞU AN ÇALINIYOR",
              "KM/H": "KM/S",
              "km/h": "KM/S",
          }

          name_patched = 0
          for dp, _, files in os.walk("fermata/src"):
              norm = dp.replace("\\", "/")
              if "/test" in norm or "/androidTest" in norm:
                  continue
              for fn in files:
                  if fn.endswith(".xml") and "values" in dp:
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = app_key_pat.sub(r'\g<1>' + APP_NAME + r'\g<3>', orig)
                      new_txt = exact_fermata_text_pat.sub(r'\g<1>' + APP_NAME + r'\g<2>', new_txt)
                      if os.path.basename(dp) in ("values", "values-tr"):
                          for eng, tr_val in tr_exact_labels.items():
                              new_txt = re.sub(
                                  r'(<string\b[^>]*>)\s*' + re.escape(eng) + r'\s*(</string>)',
                                  r'\g<1>' + tr_val + r'\g<2>',
                                  new_txt
                              )
                      if safe_write_xml(p, new_txt, orig):
                          name_patched += 1
                  elif fn.endswith(".java"):
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if '"KM/H"' in orig or '"km/h"' in orig:
                          new_j = orig.replace('"KM/H"', '"KM/S"').replace('"km/h"', '"KM/S"')
                          if new_j != orig:
                              open(p, "w", encoding="utf-8").write(new_j)
          print(f"Toplam XML string yamasi: {name_patched}")

          # =========================================================
          # 2) UYGULAMA IKONUNU VE TRANSPARAN ARKA PLAN FILIGRANINI
          #    TUM DIZINLERE ISLE + 3 TEMA DRAWABLE DOSYALARI URET
          # =========================================================
          def load_logo():
              candidates = []
              for pat in ("an_car_a_logo.*", "res/an_car_a_logo.*", ".github/an_car_a_logo.*"):
                  candidates.extend(glob.glob(pat))
              for path in candidates:
                  if not os.path.isfile(path) or os.path.getsize(path) < 500:
                      continue
                  if not path.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".heic", ".avif")):
                      continue
                  try:
                      im = Image.open(path).convert("RGBA")
                      print(f"Repodan ozel An_car_A gorseli yuklendi: {path} ({im.size})")
                      return im
                  except Exception:
                      pass
              raw = base64.b64decode("".join(EMBEDDED_LOGO_B64.split()))
              im = Image.open(io.BytesIO(raw)).convert("RGBA")
              print(f"Gomulu tam Anka + An_car_A logosu yuklendi ({im.size})")
              return im

          img = load_logo()
          w, h = img.size
          side = min(w, h)
          img = ImageOps.fit(img, (side, side), method=Image.Resampling.LANCZOS)

          # 2A) Yuksek cozunurluklu (768x768) transparan arka plan filigrani
          wm_base = img.resize((768, 768), Image.Resampling.LANCZOS).convert("RGBA")
          wm_arr = np.array(wm_base, dtype=np.float32)
          lum = wm_arr[:, :, 0] * 0.299 + wm_arr[:, :, 1] * 0.587 + wm_arr[:, :, 2] * 0.114
          wm_arr[:, :, 3] = np.clip((lum - 13.0) * 1.95, 0, 255) * 0.50
          wm_transparent = Image.fromarray(wm_arr.astype(np.uint8), "RGBA")

          mipmap_icons = {"ic_launcher", "ic_launcher_round"}
          drawable_icons = {"ic_launcher", "ic_launcher_round"}
          for mf in glob.glob("fermata/src/**/AndroidManifest.xml", recursive=True):
              if "/test" in mf.replace("\\", "/"):
                  continue
              mtxt = open(mf, encoding="utf-8", errors="ignore").read()
              for m in re.finditer(r'android:(?:icon|roundIcon)="@(mipmap|drawable)/([^"]+)"', mtxt):
                  if m.group(1) == "mipmap":
                      mipmap_icons.add(m.group(2))
                  else:
                      drawable_icons.add(m.group(2))

          res_dirs = []
          for cand in ("fermata/src/main/res", "fermata/src/auto/res", "fermata/src/autoRelease/res", "fermata/src/release/res"):
              if os.path.isdir(cand) or cand in ("fermata/src/main/res", "fermata/src/auto/res"):
                  os.makedirs(cand, exist_ok=True)
                  res_dirs.append(cand)

          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          fg_sizes = {"mipmap-mdpi": 108, "mipmap-hdpi": 162, "mipmap-xhdpi": 216, "mipmap-xxhdpi": 324, "mipmap-xxxhdpi": 432}

          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  if not (bname.startswith("mipmap-") or bname.startswith("drawable")):
                      continue
                  for fn in files:
                      stem = os.path.splitext(fn)[0]
                      if stem in mipmap_icons or stem in drawable_icons or stem.startswith("ic_launcher") or stem == "anka_ra_ic_fg":
                          os.remove(os.path.join(dp, fn))

              for folder, px in sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  for iname in mipmap_icons:
                      resized.save(os.path.join(out_dir, f"{iname}.png"), format="PNG")

              for folder, px in fg_sizes.items():
                  out_dir = os.path.join(rdir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  canvas = Image.new("RGBA", (px, px), (0, 0, 0, 255))
                  inner = int(px * 0.76)
                  fg_icon = img.resize((inner, inner), Image.Resampling.LANCZOS)
                  off = (px - inner) // 2
                  canvas.paste(fg_icon, (off, off), fg_icon)
                  canvas.save(os.path.join(out_dir, "anka_ra_ic_fg.png"), format="PNG")

              anydpi = os.path.join(rdir, "mipmap-anydpi-v26")
              os.makedirs(anydpi, exist_ok=True)
              adaptive_xml = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@color/anka_ra_icon_bg" />\n'
                  '    <foreground android:drawable="@mipmap/anka_ra_ic_fg" />\n'
                  '</adaptive-icon>\n'
              )
              for iname in mipmap_icons:
                  open(os.path.join(anydpi, f"{iname}.xml"), "w", encoding="utf-8").write(adaptive_xml)

              d_xxxhdpi = os.path.join(rdir, "drawable-xxxhdpi")
              os.makedirs(d_xxxhdpi, exist_ok=True)
              img_192 = img.resize((192, 192), Image.Resampling.LANCZOS)
              for dname in drawable_icons:
                  img_192.save(os.path.join(d_xxxhdpi, f"{dname}.png"), format="PNG")

              nodpi_dir = os.path.join(rdir, "drawable-nodpi")
              os.makedirs(nodpi_dir, exist_ok=True)
              wm_transparent.save(os.path.join(nodpi_dir, "an_car_a_watermark.png"), format="PNG")

              # 3 Tema Cam Kart Drawable: 1) Siyah (#B510131A), 2) Siyah/Gold (#BA120F09), 3) Beyaz (#E6FFFFFF)
              draw_dir = os.path.join(rdir, "drawable")
              os.makedirs(draw_dir, exist_ok=True)
              open(os.path.join(draw_dir, "an_car_a_card_black.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#B510131A" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#40FFFFFF" />\n'
                  '</shape>\n'
              )
              open(os.path.join(draw_dir, "an_car_a_card_gold.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#BA120F09" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#80D4AF37" />\n'
                  '</shape>\n'
              )
              open(os.path.join(draw_dir, "an_car_a_card_white.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n'
                  '    <solid android:color="#E6FFFFFF" />\n'
                  '    <corners android:radius="22dp" />\n'
                  '    <stroke android:width="1.25dp" android:color="#330F172A" />\n'
                  '</shape>\n'
              )

              val_dir = os.path.join(rdir, "values")
              os.makedirs(val_dir, exist_ok=True)
              open(os.path.join(val_dir, "anka_ra_colors.xml"), "w", encoding="utf-8").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="anka_ra_icon_bg">#000000</color>\n'
                  '    <color name="anka_ra_bg">#000000</color>\n'
                  '    <color name="anka_ra_surface">#10131A</color>\n'
                  '    <color name="anka_ra_cyan">#38BDF8</color>\n'
                  '    <color name="anka_ra_crimson">#E11D48</color>\n'
                  '    <color name="anka_ra_gold">#F59E0B</color>\n'
                  '    <color name="anka_ra_white_bg">#EEF2F6</color>\n'
                  '</resources>\n'
              )
          print("OK: An_car_A ikonu, transparan filigran ve 3 tema drawable kaynaklari islendi.")

          # =========================================================
          # 3) YALNIZCA 3 TEMA SECENEGI:
          #    1. An_car_A Siyah (Varsayilan)
          #    2. An_car_A Siyah / Gold
          #    3. An_car_A Beyaz
          #    + MAVI ARKA PLAN RENK TANIMLARINI TAMAMEN SIYAHA CEVIR
          # =========================================================
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  if not os.path.basename(dp).startswith("values"):
                      continue
                  for fn in files:
                      if not fn.endswith(".xml") or fn == "anka_ra_colors.xml":
                          continue
                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = orig
                      def _trim_theme_array(m):
                          header, body, footer = m.group(1), m.group(2), m.group(3)
                          if "theme" in header.lower():
                              return (
                                  header
                                  + '\n        <item>An_car_A Siyah</item>'
                                  + '\n        <item>An_car_A Siyah / Gold</item>'
                                  + '\n        <item>An_car_A Beyaz</item>\n    '
                                  + footer
                              )
                          return m.group(0)
                      new_txt = re.sub(r'(<string-array\b[^>]*>)(.*?)(</string-array>)', _trim_theme_array, new_txt, flags=re.DOTALL | re.IGNORECASE)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_dark"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_black"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah / Gold\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_light"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Beyaz\g<3>', new_txt, flags=re.DOTALL)
