                      continue
                  p = os.path.join(dp, fn)
                  src = open(p, encoding="utf-8").read()
                  new_src = src.replace('"KM/H"', '"KM/S"').replace('"km/h"', '"KM/S"')
                  new_src = re.sub(r'\baddShortcutTile\s*\(', 'if (false) addShortcutTile(', new_src)
                  new_src = re.sub(r'(toIntPx\s*\([^,]+,\s*)(2[0-9]|3[0-6])(\s*\))', lambda m: f"{m.group(1)}{int(round(int(m.group(2)) * 1.10))}{m.group(3)}", new_src)
                  def _boost_java_sp(m):
                      val = float(m.group(2))
                      if 10.0 <= val <= 16.0:
                          return f"{m.group(1)}{val * 1.35:.1f}f{m.group(3)}"
                      return m.group(0)
                  new_src = re.sub(r'(setTextSize\s*\(\s*(?:TypedValue\.COMPLEX_UNIT_SP\s*,\s*)?)(1[0-6](?:\.\d+)?)f(\s*\))', _boost_java_sp, new_src)
                  # Hardcoded mavi renkleri siyaha cek
                  new_src = re.sub(r'Color\.parseColor\(\s*"#(?:[0-9a-fA-F]{2})?(?:0[0-9a-fA-F]|1[0-9a-fA-F])(?:2[0-9a-fA-F]|3[0-9a-fA-F]|4[0-9a-fA-F]|5[0-9a-fA-F])(?:[6-9a-fA-F][0-9a-fA-F])"\s*\)', 'Color.parseColor("#000000")', new_src)
                  if "AnCarAThemeHelper.applyToCockpit" not in new_src:
                      for hook_m in ("onFinishInflate", "onViewCreated"):
                          m_sig = re.search(r'\bvoid\s+' + hook_m + r'\s*\([^)]*\)\s*\{', new_src)
                          if m_sig:
                              m_sup = re.search(r'super\.' + hook_m + r'\s*\([^;]*\)\s*;', new_src[m_sig.end():])
                              ins_p = m_sig.end() + (m_sup.end() if m_sup else 0)
                              target_view = "view" if hook_m == "onViewCreated" else "this"
                              new_src = new_src[:ins_p] + f"\n        me.aap.fermata.hacim.AnCarAThemeHelper.applyToCockpit({target_view});\n" + new_src[ins_p:]
                              break
                  if new_src != src:
                      open(p, "w", encoding="utf-8").write(new_src)

