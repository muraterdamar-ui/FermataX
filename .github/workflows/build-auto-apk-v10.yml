                      a_attr(wm_iv, "layout_gravity", "center")
                      a_attr(wm_iv, "src", "@drawable/an_car_a_watermark")
                      a_attr(wm_iv, "scaleType", "fitCenter")
                      a_attr(wm_iv, "alpha", "0.48")
                      a_attr(wm_iv, "tag", "an_car_a_watermark")
                      root.append(wm_iv)

                      inner_container = ET.Element(orig_root_tag, orig_attribs)
                      a_attr(inner_container, "layout_width", "match_parent")
                      a_attr(inner_container, "layout_height", "match_parent")
                      a_attr(inner_container, "background", "#00000000")
                      for ch in orig_children:
