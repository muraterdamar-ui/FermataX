          for cf in glob.glob("fermata/src/**/*Car*.java", recursive=True) + glob.glob("fermata/src/**/*Auto*.java", recursive=True):
              norm_c = cf.replace("\\", "/")
              if "/test" in norm_c or "/hacim/" in norm_c:
                  continue
              csrc = open(cf, encoding="utf-8", errors="ignore").read()
              if "class " not in csrc:
                  continue
              is_ctx_subclass = bool(re.search(r'\bextends\s+(?:[A-Za-z0-9_.]*\.)?(?:AppCompatActivity|FragmentActivity|BaseActivity|MainActivity|CarActivity|Activity|ContextWrapper|Service)\b', csrc))
              if is_ctx_subclass:
                  hook_create = "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this); me.aap.fermata.hacim.HacimWakeService.start(this); me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoConnected();"
                  hook_destroy = "me.aap.fermata.hacim.HacimAssistant.getInstance(this).onAndroidAutoDisconnected();"
              else:
                  hook_create = "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this); me.aap.fermata.hacim.AnCarAThemeHelper.startWakeIfPossible(this); me.aap.fermata.hacim.AnCarAThemeHelper.onAutoConnectedIfPossible(this);"
                  hook_destroy = "me.aap.fermata.hacim.AnCarAThemeHelper.onAutoDisconnectedIfPossible(this);"

              cnew, ok_c1 = inject_after_super_call(csrc, "onCreate", hook_create)
              if not ok_c1:
                  cnew, ok_c1 = inject_after_super_call(cnew, "onStart", hook_create)
              cnew, ok_c2 = inject_after_super_call(
                  cnew,
                  "onResume",
                  "me.aap.fermata.hacim.AnCarAThemeHelper.attachWatermarkToWindow(this);"
              )
              cnew, ok_c3 = inject_after_super_call(cnew, "onDestroy", hook_destroy)
              if ok_c1 or ok_c2 or ok_c3:
