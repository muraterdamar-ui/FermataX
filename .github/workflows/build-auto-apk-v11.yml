                  )
                  s_new = re.sub(
                      r'(o\.values\s*=\s*new\s+int\[\]\s*\{)[^}]*THEME_DARK[^}]*(\})',
                      r'\g<1>MainActivityPrefs.THEME_DARK, MainActivityPrefs.THEME_BLACK, MainActivityPrefs.THEME_LIGHT\g<2>',
                      s_new
                  )
              else:
                  # Index bazli: 0 -> Siyah (THEME_DARK), 1 -> Beyaz (THEME_LIGHT), 2 -> Siyah/Gold (THEME_DAY_NIGHT->Gold)
