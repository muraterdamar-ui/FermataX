                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_DARK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 0);', asrc)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_BLACK\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 1);', anew)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_DAY_NIGHT\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 1);', anew)
                      anew = re.sub(r'(case\s+(?:MainActivityPrefs\.)?THEME_LIGHT\s*:)', r'\1 me.aap.fermata.hacim.AnCarAThemeHelper.syncFromFermataThemePref(this, 2);', anew)
                      # THEME_DAY_NIGHT artik Siyah/Gold oldugu icin DayNight stili yerine koyu/siyah stili kullan
                      anew = re.sub(r'R\.style\.AppTheme_DayNight\b', 'R.style.AppTheme_Black', anew)
                      if anew != asrc:
                          open(af, "w", encoding="utf-8").write(anew)
                          print(f"OK: Tema senkronizasyonu eklendi: {af}")

          # Mavi arka plan renklerini XML resources & drawable shape'lerden tamamen temizle (Tam Siyah #000000 + Cam #B510131A)
          LEGACY_BLUES = {
              "#0D47A1", "#1565C0", "#1976D2", "#1E88E5", "#2196F3",
              "#002171", "#003C8F", "#3F51B5", "#303F9F", "#1A237E"
          }
          def remap_hex_color(name_l, hex_val):
              raw = hex_val.lstrip("#")
              if len(raw) == 6:
                  alpha, rgb = "", raw.upper()
              elif len(raw) == 8:
                  alpha, rgb = raw[:2].upper(), raw[2:].upper()
              else:
                  return hex_val
              if alpha in ("00",):
                  return hex_val
              if any(k in name_l for k in ("text", "title", "subtitle", "white", "black", "transparent", "error", "red", "green", "success", "warning")):
                  return hex_val
              if "light" in name_l or "day" in name_l:
                  return hex_val
              if "#" + rgb in LEGACY_BLUES:
                  return "#" + alpha + "09090B"
              if any(k in name_l for k in ("window_bg", "windowbackground", "screen_bg", "root_bg", "canvas_bg", "scaffold", "bg_dark", "glass_bg", "background_dark", "dark_bg", "main_bg", "auto_bg", "car_bg")):
                  return "#" + alpha + "000000"
              if any(k in name_l for k in ("card_bg", "card_surface", "tile_bg", "panel_bg", "surface", "dock", "navbar", "nav_bg", "bottom_bar", "toolbar_bg", "header_bg", "sheet_bg", "player_bg")):
                  return "#B510131A" if alpha else "#10131A"
              if any(k in name_l for k in ("stroke", "border", "outline")):
                  return "#40FFFFFF" if alpha else "#262B36"
              if any(k in name_l for k in ("accent", "primary", "active", "selected", "checked", "highlight", "cyan", "teal", "tint", "fab", "play_btn")):
                  if "dark" in name_l or "bg" in name_l:
                      return "#" + alpha + "090C10"
                  return "#" + alpha + "38BDF8"
              if any(k in name_l for k in ("star", "favorite", "fav_")):
                  return "#" + alpha + "FBBF24"
              return hex_val

          color_tag_pat = re.compile(r'(<color\s+name="([^"]+)"[^>]*>\s*)(#[0-9a-fA-F]{6,8})(\s*</color>)')
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  bname = os.path.basename(dp)
                  for fn in files:
                      p = os.path.join(dp, fn)
                      if not fn.endswith(".xml") or fn in ("anka_ra_colors.xml", "an_car_a_card_black.xml", "an_car_a_card_gold.xml", "an_car_a_card_white.xml"):
                          continue
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      if bname.startswith("values"):
                          new_txt = color_tag_pat.sub(lambda m: m.group(1) + remap_hex_color(m.group(2).lower(), m.group(3)) + m.group(4), orig)
                          if "theme" in fn.lower() or "style" in fn.lower() or "glass" in fn.lower():
                              new_txt = re.sub(r'(<item\s+name="(?:android:)?windowBackground">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)', r'\g<1>#000000\g<2>', new_txt)
                              new_txt = re.sub(r'(<item\s+name="(?:colorAccent|colorPrimary|colorSecondary)">)\s*#[0-9a-fA-F]{6,8}(\s*</item>)', r'\g<1>#38BDF8\g<2>', new_txt)
                          safe_write_xml(p, new_txt, orig)
                      elif bname.startswith("drawable"):
                          # Ozellik adini (color/startColor/centerColor/endColor) koruyarak mavi tonlari koyu fume cama cevir
                          new_txt = re.sub(
                              r'(android:(?:color|startColor|centerColor|endColor)=)"#(?:[0-9a-fA-F]{2})?(?:0[0-9a-fA-F]|1[0-9a-fA-F])(?:2[0-9a-fA-F]|3[0-9a-fA-F]|4[0-9a-fA-F]|5[0-9a-fA-F])(?:[6-9a-fA-F][0-9a-fA-F])"',
                              r'\1"#B510131A"',
                              orig
                          )
                          safe_write_xml(p, new_txt, orig)

          # =========================================================
          # 4) KOKPIT LAYOUT, SOL KART BIRLESTIRME & TRANSPARAN LOGO
          # =========================================================
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)
          ET.register_namespace("app", "http://schemas.android.com/apk/res-auto")
          ET.register_namespace("tools", "http://schemas.android.com/tools")

          def a_attr(el, name, val=None):
              key = "{" + ANDROID_NS + "}" + name
              if val is None:
                  return el.get(key)
              el.set(key, val)
              return val

          def subtree_text(el):
              parts = []
              for sub in el.iter():
                  for k, v in sub.attrib.items():
                      parts.append(str(v))
              return " ".join(parts).lower()

          def boost_left_card_fonts_xml(card_root):
              for el in card_root.iter():
                  cid = (a_attr(el, "id") or "").lower()
                  ctext = (a_attr(el, "text") or "").strip()
                  if "km/h" in ctext.lower():
                      a_attr(el, "text", re.sub(r"km/h", "KM/S", ctext, flags=re.IGNORECASE))
                      ctext = a_attr(el, "text") or ""
                  ctext_l = ctext.lower()

                  if any(k in cid or k in ctext_l for k in ("permission_hint", "location_hint", "her zaman izin", "always allow")):
                      a_attr(el, "visibility", "gone")
                      continue

                  if "forecast" in cid or "hourly" in cid:
                      if el.tag.endswith("LinearLayout") or el.tag.endswith("GridLayout"):
                          el.tag = "GridLayout"
                          a_attr(el, "columnCount", "2")
                          a_attr(el, "rowCount", "2")
                      for sub in el.iter():
                          if sub.tag.endswith("ImageView"):
                              a_attr(sub, "layout_width", "32dp")
                              a_attr(sub, "layout_height", "32dp")
                          elif sub.tag.endswith("TextView"):
                              st = (a_attr(sub, "text") or "").strip()
                              a_attr(sub, "textSize", "24sp" if "°" in st else "19sp")
                              a_attr(sub, "textStyle", "bold")
                      continue

                  if el.tag.endswith("ImageView"):
                      if any(k in cid for k in ("weather_icon", "icon_weather", "condition_icon")):
                          a_attr(el, "layout_width", "58dp")
                          a_attr(el, "layout_height", "58dp")

                  if el.tag.endswith("TextView"):
                      ts = a_attr(el, "textSize")
                      orig_sp = 0.0
                      if ts and ts.endswith("sp"):
                          try:
                              orig_sp = float(ts[:-2])
                          except Exception:
                              orig_sp = 0.0

                      is_hourly_leaf = any(k in cid for k in ("hour", "forecast_temp", "forecast_time"))
                      is_speed_num = (
                          ("speed" in cid and not any(x in cid for x in ("unit", "label", "title", "header", "card")))
                          or (ctext.isdigit() and len(ctext) <= 3 and orig_sp >= 24.0)
                      )
                      is_main_temp = (
                          (any(k in cid for k in ("temp", "temperature", "degree")) and not is_hourly_leaf and not any(x in cid for x in ("min", "max", "range", "hourly")))
                          or ("°c" in ctext_l and orig_sp >= 22.0)
                      )

                      if is_speed_num:
                          a_attr(el, "textSize", "58sp")
                          a_attr(el, "textStyle", "bold")
                          a_attr(el, "includeFontPadding", "false")
                      elif is_main_temp:
                          a_attr(el, "textSize", "50sp")
                          a_attr(el, "textStyle", "bold")
                          a_attr(el, "includeFontPadding", "false")
                      elif is_hourly_leaf:
                          a_attr(el, "textSize", "24sp" if ("temp" in cid or "°" in ctext) else "19sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("unit", "kmh", "kms")) or ctext_l in ("km/h", "km/s"):
                          a_attr(el, "textSize", "22sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("distance", "eta", "duration", "trip", "arrival", "remaining")):
                          a_attr(el, "textSize", "24sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("condition", "weather_desc", "summary", "city", "location")):
                          a_attr(el, "textSize", "23sp")
                          a_attr(el, "textStyle", "bold")
                      elif any(k in cid for k in ("title", "header")):
                          a_attr(el, "textSize", "20sp")
                          a_attr(el, "textStyle", "bold")
                      else:
                          new_sp = max(21, int(round(orig_sp * 1.32))) if orig_sp > 0 else 22
                          a_attr(el, "textSize", f"{new_sp}sp")
                          a_attr(el, "textStyle", "bold")

          layout_files = []
          for rdir in res_dirs:
              for dp, _, files in os.walk(rdir):
                  if "layout" not in os.path.basename(dp):
                      continue
                  for fn in files:
                      if fn.endswith(".xml"):
                          layout_files.append(os.path.join(dp, fn))

          for l_path in layout_files:
              try:
                  orig_xml = open(l_path, encoding="utf-8").read()
                  low_xml = orig_xml.lower()
                  is_cockpit = ("glass" in os.path.basename(l_path).lower()) or ("speed" in low_xml and "weather" in low_xml) or ("weather" in low_xml and "forecast" in low_xml)
                  if not is_cockpit:
                      continue

                  root = ET.fromstring(orig_xml.encode("utf-8"))

                  merged_speed_card = None
                  for parent in root.iter():
                      children = list(parent)
                      if len(children) >= 2:
                          sp_idx = next((i for i, ch in enumerate(children) if any(k in subtree_text(ch) for k in ("speed", "km/h", "km/s", "trip"))), None)
                          wt_idx = next((i for i, ch in enumerate(children) if i != sp_idx and any(k in subtree_text(ch) for k in ("weather", "°c", "forecast"))), None)
                          if sp_idx is not None and wt_idx is not None:
                              speed_card = children[sp_idx]
                              weather_card = children[wt_idx]
                              a_attr(speed_card, "layout_weight", "0.42")
