                      p = os.path.join(dp, fn)
                      orig = open(p, encoding="utf-8", errors="ignore").read()
                      new_txt = orig
                      def _trim_theme_array(m):
                          header, body, footer = m.group(1), m.group(2), m.group(3)
                          if "theme" in header.lower():
                              return (
                                  header
                                  + '\n        <item>An_car_A Siyah</item>'
                                  + '\n        <item>An_car_A Siyah / Gold</item>'
                                  + '\n        <item>An_car_A Beyaz</item>\n    '
                                  + footer
                              )
                          return m.group(0)
                      new_txt = re.sub(r'(<string-array\b[^>]*>)(.*?)(</string-array>)', _trim_theme_array, new_txt, flags=re.DOTALL | re.IGNORECASE)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_dark"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_black"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Siyah / Gold\g<3>', new_txt, flags=re.DOTALL)
                      new_txt = re.sub(r'(<string\b[^>]*\bname="theme_light"[^>]*>)(.*?)(</string>)', r'\g<1>An_car_A Beyaz\g<3>', new_txt, flags=re.DOTALL)
