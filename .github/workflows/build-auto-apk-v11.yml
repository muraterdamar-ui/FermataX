                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.READ_MEDIA_AUDIO",
                  "android.permission.READ_EXTERNAL_STORAGE",
              ):
                  if perm not in mnew:
                      mnew = mnew.replace("<application", f'    <uses-permission android:name="{perm}" />\n    <application', 1)

              if "com.google.android.apps.youtube.music" not in mnew:
                  if "<queries>" in mnew:
                      mnew = mnew.replace("<queries>", '<queries>\n        <package android:name="com.google.android.apps.youtube.music" />', 1)
                  else:
                      mnew = mnew.replace("<application", '    <queries>\n        <package android:name="com.google.android.apps.youtube.music" />\n    </queries>\n    <application', 1)

              if "me.aap.fermata.hacim.HacimWakeService" not in mnew:
                  svc_decl = (
                      '        <service\n'
                      '            android:name="me.aap.fermata.hacim.HacimWakeService"\n'
                      '            android:enabled="true"\n'
                      '            android:exported="false"\n'
                      '            android:foregroundServiceType="microphone" />\n'
                      '    </application>'
                  )
                  mnew = mnew.replace("</application>", svc_decl, 1)

              if safe_write_xml(main_manifest, mnew, morig):
                  print("OK: AndroidManifest.xml izinleri ve HacimWakeService eklendi.")
          PY

